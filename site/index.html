/* ===== rzfun7.js (v23.19): four more Challenge games
   - lights:  "Light the lanterns" tap a lantern to switch it and its neighbours; light them all (Easy 3x3 plus-shape off, Challenge 4x4). (cat maze)
   - grid:    "Picture puzzle" each row and column has each picture once (Easy 3x3 with 2 blanks, Challenge 4x4 with 4 blanks, one per row so every gap has one answer). (cat detect)
   - sumpop:  "Make the number" pop two bubbles that add up to the number (Easy: make 3 to 5; Challenge: 6 to 10, 3 rounds). (cat num)
   - shell:   "Where did the ladybug go?" watch the cups swap, then tap the one hiding the ladybug (Easy 3 slow swaps, Challenge 6 fast). (cat detect)
   Nothing is lost on a wrong tap. ===== */
/* ---------- Light the lanterns (lights-out, always solvable: made by pressing from all-lit) ---------- */
RZ_MAKE.lights = function(){ const e = easy(), N = e ? 3 : 4, presses = e ? 2 + Math.floor(Math.random()*2) : 4 + Math.floor(Math.random()*3);
  let on = Array(N*N).fill(1); const P = cshuf([...Array(N*N).keys()]).slice(0, presses);
  const flip = (a,k)=>{ const r = Math.floor(k/N), c = k%N; [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{ const rr = r+dr, cc = c+dc; if(rr>=0&&rr<N&&cc>=0&&cc<N) a[rr*N+cc] ^= 1; }); };
  P.forEach(k=>flip(on,k)); if(on.every(x=>x)) flip(on, 0);
  return {type:'lights', title:'Light every lantern! A tap changes its neighbours too.', N, on, sol:P, sig:N+':'+on.join('')}; };
function rzLightsPlay(g){
  const N = g.N, sz = N===3 ? 120 : 96, on = g.on.slice(), sol = new Set(g.sol); let taps = 0;
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">Taps: 0</div>
    <div class="rzlights" style="grid-template-columns:repeat(${N},${sz}px)">${on.map((v,k)=>`<button class="rzlan ${v?'on':''}" data-k="${k}" style="width:${sz}px;height:${sz}px" aria-label="Lantern"><span>🏮</span></button>`).join('')}</div>`);
  const btn = [...document.querySelectorAll('.rzlan')];
  const flip = k=>{ const r = Math.floor(k/N), c = k%N; [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{ const rr = r+dr, cc = c+dc; if(rr>=0&&rr<N&&cc>=0&&cc<N){ const j = rr*N+cc; on[j] ^= 1; btn[j].classList.toggle('on', !!on[j]); btn[j].classList.remove('flick'); void btn[j].offsetWidth; btn[j].classList.add('flick'); } }); };
  btn.forEach(b=>b.onclick=()=>{ if(!G.live) return; poke(); const k = +b.dataset.k; flip(k); if(sol.has(k)) sol.delete(k); else sol.add(k); taps++; tone(on[k]?700:420,.08,'triangle',.12);
    document.getElementById('cnt').textContent = `Taps: ${taps}`;
    if(on.every(x=>x)){ clearHint(); G.getT = null; document.querySelector('.rzlights').classList.add('glowall'); tone(523,.15,'triangle',.15); tone(784,.25,'triangle',.15,.15); rzDoneLater(1200); } });
  // the hint shows one lantern from a solution (pressing every lantern in the solution set once solves it)
  armHint(()=>{ const k = [...sol][0]; return k==null ? null : btn[k]; });
}

/* ---------- Picture puzzle (Latin square) ---------- */
const RZ_GRIDSETS = [['🍎','🍌','🍇','🍓'],['🐶','🐱','🐰','🐻'],['⭐','🌙','☀️','☁️'],['🚗','🚂','⛵','✈️'],['🔴','🟡','🔵','🟢']];
RZ_MAKE.grid = function(){ const e = easy(), N = e ? 3 : 4, set = cshuf(rzOne(RZ_GRIDSETS)).slice(0, N), blanks = e ? 2 : 4;
  const rows = cshuf([...Array(N).keys()]), cols = cshuf([...Array(N).keys()]), sym = cshuf([...Array(N).keys()]);
  const sol = []; for(let r=0;r<N;r++) for(let c=0;c<N;c++) sol.push(set[sym[(rows[r]+cols[c])%N]]);
  // blanks: no two in the same row AND column pair so each blank has a unique answer by its row alone
  const hole = []; const usedR = new Set(); for(const k of cshuf([...Array(N*N).keys()])){ const r = Math.floor(k/N); if(hole.length>=blanks) break; if(usedR.has(r)) continue; hole.push(k); usedR.add(r); }
  return {type:'grid', title:'Each row and each column has every picture once. Fill the gaps!', N, set, sol, hole, sig:sol.join('')+hole.join(',')}; };
function rzGridPlay(g){
  const N = g.N, sz = N===3 ? 120 : 100; let cur = null, n = 0;
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">0 / ${g.hole.length}</div>
    <div class="rzgridw"><div class="rzgrid" style="grid-template-columns:repeat(${N},${sz}px)">${g.sol.map((x,k)=>g.hole.includes(k) ? `<button class="rzgc hole" data-k="${k}" style="width:${sz}px;height:${sz}px" aria-label="Gap">?</button>` : `<div class="rzgc" style="width:${sz}px;height:${sz}px">${x}</div>`).join('')}</div>
    <div class="rzgpick">${g.set.map(x=>`<button class="rzgp" data-x="${x}" aria-label="Picture">${x}</button>`).join('')}</div></div>`);
  const holes = [...document.querySelectorAll('.rzgc.hole')];
  const choose = h=>{ holes.forEach(x=>x.classList.remove('sel')); cur = h; if(h) h.classList.add('sel'); };
  choose(holes[0]);
  holes.forEach(h=>h.onclick=()=>{ if(!G.live || h.classList.contains('done')) return; poke(); choose(h); tone(600,.06,'triangle',.1); });
  document.querySelectorAll('.rzgp').forEach(p=>p.onclick=()=>{ if(!G.live || !cur) return; const k = +cur.dataset.k;
    if(p.dataset.x===g.sol[k]){ poke(); cur.textContent = p.dataset.x; cur.classList.add('done'); n++; tone(560+n*60,.12,'triangle',.15); document.getElementById('cnt').textContent = `${n} / ${g.hole.length}`;
      const next = holes.find(h=>!h.classList.contains('done')); choose(next || null); if(!next){ clearHint(); G.getT = null; rzDoneLater(1000); } }
    else { miss(); cur.classList.remove('shake'); void cur.offsetWidth; cur.classList.add('shake'); tone(220,.12,'sine',.1); } });
  armHint(()=> cur ? document.querySelector(`.rzgp[data-x="${g.sol[+cur.dataset.k]}"]`) : null);
}

/* ---------- Make the number ---------- */
RZ_MAKE.sumpop = function(){ const e = easy(), rounds = e ? 2 : 3, R = [];
  for(let r=0;r<rounds;r++){ const t = e ? 3 + Math.floor(Math.random()*3) : 6 + Math.floor(Math.random()*5); const a = 1 + Math.floor(Math.random()*(t-1)), b = t - a;
    const nums = [a, b]; while(nums.length < (e ? 4 : 6)){ const x = 1 + Math.floor(Math.random()*9); if(!nums.includes(x) || nums.length>3) nums.push(x); }
    R.push({t, a, b, nums:cshuf(nums)}); }
  return {type:'sumpop', title:'Pop two bubbles that make the number!', R, sig:R.map(r=>r.t+':'+r.nums.join('')).join('|')}; };
function rzSumpopPlay(g){
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">Round 1 / ${g.R.length}</div>
    <div class="rzsum"><div class="rzsumt"><span id="rzsa">?</span> + <span id="rzsb">?</span> = <b id="rzst"></b></div><div class="rzsumb" id="rzsbb"></div></div>`);
  let r = 0, pick = [];

    document.getElementById('rzsbb').innerHTML = R.nums.map((x,k)=>`<button class="rzsbub" data-k="${k}" style="animation-delay:${(k*.3).toFixed(1)}s" aria-label="${x}">${x}</button>`).join('');
    if(R.t<=20) lsoft(String(R.t), ['N:'+R.t]);
    document.querySelectorAll('.rzsbub').forEach(b=>b.onclick=()=>{ if(!G.live || b.classList.contains('pop') || pick.length>=2) return; poke(); const v = R.nums[+b.dataset.k]; pick.push(b); b.classList.add('pop'); tone(500+pick.length*120,.1,'triangle',.14);
      document.getElementById(pick.length===1 ? 'rzsa' : 'rzsb').textContent = v;
      if(pick.length===2){ const s = pick.reduce((a,x)=>a + R.nums[+x.dataset.k], 0);
        if(s===R.t){ clearHint(); sfx.chime(); r++; if(r>=g.R.length){ G.getT = null; rzDoneLater(1100); } else setTimeout(round, 1300); }
        else { miss(); document.getElementById('rzst').classList.add('shake'); setTimeout(()=>{ if(!G.live) return; document.getElementById('rzst').classList.remove('shake'); pick.forEach(x=>x.classList.remove('pop')); pick = []; document.getElementById('rzsa').textContent = '?'; document.getElementById('rzsb').textContent = '?'; }, 900); } } });
    armHint(()=>{ const R2 = g.R[r]; if(!R2) return null; const want = pick.length ? R2.t - R2.nums[+pick[0].dataset.k] : R2.a; return [...document.querySelectorAll('.rzsbub:not(.pop)')].find(b=>R2.nums[+b.dataset.k]===want) || null; }); }
  round();
}

/* ---------- Where did the ladybug go? (shell game) ---------- */
RZ_MAKE.shell = function(){ const e = easy(), cups = e ? 3 : 4, swaps = e ? 3 : 6, sp = e ? 700 : 430, start = Math.floor(Math.random()*cups);
  const S = Array.from({length:swaps},()=>{ const a = Math.floor(Math.random()*cups); let b; do{ b = Math.floor(Math.random()*cups); }while(b===a); return [a,b]; });
  return {type:'shell', title:'Watch the cups! Where is the ladybug hiding?', cups, S, sp, start, sig:start+':'+S.map(x=>x.join('')).join(',')}; };
function rzShellPlay(g){
  const W = 170, L0 = Math.round(512 - g.cups*W/2);
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">Watch closely...</div>
    <div class="rzshell" id="rzsh">${Array.from({length:g.cups},(_,i)=>`<button class="rzcup" data-i="${i}" style="left:${L0+i*W}px" aria-label="Cup ${i+1}"><span class="cup"></span></button>`).join('')}<div class="rzhid2" id="rzhb" style="left:${L0+g.start*W}px">🐞</div></div>
    <button class="big ghost rzshagain" id="rzsag">&#8635; Watch again</button>`);
  const cups = [...document.querySelectorAll('.rzcup')], bug = document.getElementById('rzhb'), scr = app.querySelector('.screen'); let slot = cups.map((c,i)=>i), busy = true, bugCup = g.start;
  const place = ()=>cups.forEach((c,i)=>{ c.style.left = (L0 + slot[i]*W) + 'px'; });
  function run(){ busy = true; slot = cups.map((c,i)=>i); place(); bugCup = g.start; bug.style.left = (L0+g.start*W)+'px'; bug.style.opacity = 1; cups.forEach(c=>c.classList.remove('lift','up'));
    document.getElementById('cnt').textContent = 'Watch closely...';
    cups[g.start].classList.add('up'); setTimeout(()=>{ if(!scr.isConnected) return; cups[g.start].classList.remove('up'); setTimeout(()=>{ bug.style.opacity = 0; }, 300); }, 1100);
    let t = 1700; g.S.forEach(([a,b])=>{ setTimeout(()=>{ if(!scr.isConnected) return; const ia = slot.indexOf(a), ib = slot.indexOf(b); slot[ia] = b; slot[ib] = a; place(); tone(300,.05,'sine',.06); }, t); t += g.sp + 150; });
    setTimeout(()=>{ if(!scr.isConnected) return; busy = false; document.getElementById('cnt').textContent = 'Which cup? Tap it!'; armHint(()=>cups[g.start]); }, t + 200); }
  cups.forEach((c,i)=>c.onclick=()=>{ if(!G.live || busy) return; c.classList.add('lift');
    if(i===g.start){ poke(); busy = true; bug.style.left = c.style.left; bug.style.opacity = 1; clearHint(); G.getT = null; tone(660,.12,'triangle',.15); tone(880,.2,'triangle',.15,.12); document.getElementById('cnt').textContent = 'You found the ladybug!'; rzDoneLater(1200); }
    else { miss(); tone(220,.12,'sine',.1); setTimeout(()=>c.classList.remove('lift'), 700); } });
  document.getElementById('rzsag').onclick = ()=>{ if(!busy){ sfx.pop(); run(); } };
  cups.forEach(c=>c.style.transition = `left ${g.sp}ms ease-in-out, transform .3s`);
  setTimeout(run, 500);
}

/* ===== rzfun8.js (v23.20): five more Challenge games
   - icemaze:  "Slippery ice" the ladybug slides until it bumps something; reach the flower (Easy fewer moves, Challenge 5+ moves). (cat maze)
   - numtrain: "Number train" which number is missing from the train? (Easy 1-10 counting up, Challenge also by 2s and counting down). (cat num)
   - abctrain: "Letter train" which letter is missing? (Challenge: little letters, or 2 missing). (cat abc)
   - whowhere: "Who lives where?" match each bug friend (Grok's portraits) to their home. (cat detect)
   - shapepic: "Shape builder" put the shapes into the picture outline (house, rocket, boat, tree...). (cat slide)
   Nothing is lost on a wrong tap. ===== */
/* ---------- Slippery ice ---------- */
RZ_MAKE.icemaze = function(){ const e = easy(), W = e ? 6 : 8, H = e ? 5 : 6, need = e ? 3 : 5;
  for(let t=0; t<400; t++){ const rock = new Set(); const nR = e ? 6 : 12; while(rock.size < nR) rock.add(Math.floor(Math.random()*W*H));
    const free = [...Array(W*H).keys()].filter(k=>!rock.has(k)), start = rzOne(free);
    const slide = (k,d)=>{ const D = [[0,-1],[1,0],[0,1],[-1,0]][d]; let x = k%W, y = Math.floor(k/W); for(;;){ const nx = x+D[0], ny = y+D[1]; if(nx<0||ny<0||nx>=W||ny>=H||rock.has(ny*W+nx)) break; x = nx; y = ny; } return y*W+x; };
    const dist = new Map([[start,0]]), q = [start]; while(q.length){ const c = q.shift(); for(let d=0;d<4;d++){ const n = slide(c,d); if(!dist.has(n)){ dist.set(n, dist.get(c)+1); q.push(n); } } }
    const goals = [...dist.entries()].filter(([k,v])=>v>=need && v<=need+2); if(!goals.length) continue; const [goal, moves] = rzOne(goals);
    return {type:'icemaze', title:'Slippery ice! Slide to the flower!', W, H, rock:[...rock], start, goal, moves, sig:W+'x'+H+':'+[...rock].sort((a,b)=>a-b).join(',')+':'+start+':'+goal}; }
  return RZ_MAKE.maze(); };
function rzIcePlay(g){
  const {W, H} = g, cs = Math.min(Math.floor(700/W), Math.floor(340/H)), rock = new Set(g.rock), L = Math.round(512 - W*cs/2), T = 200; let pos = g.start, moves = 0, hist = [g.start];
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">Moves: 0</div>
    <div class="rzice" id="rzic" style="left:${L}px;top:${T}px;width:${W*cs}px;height:${H*cs}px">${[...Array(W*H).keys()].map(k=>`<i class="${rock.has(k)?'rk':''}" style="left:${(k%W)*cs}px;top:${Math.floor(k/W)*cs}px;width:${cs}px;height:${cs}px">${rock.has(k)?'🪨':k===g.goal?'🌸':''}</i>`).join('')}
    <div class="rzicebug" id="rzib" style="width:${cs}px;height:${cs}px;font-size:${cs*.7}px">🐞</div>
    ${[['up','⬆',0],['right','➡',1],['down','⬇',2],['left','⬅',3]].map(([n,a,d])=>`<button class="rziarr ${n}" data-d="${d}" aria-label="Slide ${n}">${a}</button>`).join('')}</div>`);
  const bug = document.getElementById('rzib'), put = ()=>{ bug.style.left = ((pos%W)*cs)+'px'; bug.style.top = (Math.floor(pos/W)*cs)+'px'; }; put();
  const slide = (k,d)=>{ const D = [[0,-1],[1,0],[0,1],[-1,0]][d]; let x = k%W, y = Math.floor(k/W); for(;;){ const nx = x+D[0], ny = y+D[1]; if(nx<0||ny<0||nx>=W||ny>=H||rock.has(ny*W+nx)) break; x = nx; y = ny; } return y*W+x; };
  const go = d=>{ if(!G.live) return; const n = slide(pos, d); if(n===pos){ miss(); bug.classList.remove('shake'); void bug.offsetWidth; bug.classList.add('shake'); tone(200,.1,'sine',.08); return; }
    poke(); pos = n; moves++; hist.push(n); put(); tone(780,.18,'sine',.07); tone(560,.12,'triangle',.06,.12); document.getElementById('cnt').textContent = `Moves: ${moves}`;
    if(pos===g.goal){ clearHint(); G.getT = null; bug.classList.add('yay'); rzDoneLater(900); } };
  document.querySelectorAll('.rziarr').forEach(b=>b.onclick=()=>go(+b.dataset.d));
  const box = document.getElementById('rzic'); let sx = null, sy = null;
  box.addEventListener('pointerdown', e=>{ sx = e.clientX; sy = e.clientY; });
  box.addEventListener('pointerup', e=>{ if(sx==null) return; const dx = e.clientX-sx, dy = e.clientY-sy; sx = null; if(Math.max(Math.abs(dx),Math.abs(dy)) < 30) return; go(Math.abs(dx)>Math.abs(dy) ? (dx>0?1:3) : (dy>0?2:0)); });
  rzUndo = ()=>{ if(hist.length<2) return; hist.pop(); pos = hist[hist.length-1]; moves = Math.max(0, moves-1); put(); document.getElementById('cnt').textContent = `Moves: ${moves}`; };
  // hint: the next arrow on a shortest path
  armHint(()=>{ const prev = new Map([[pos,-1]]), q = [pos]; let hit = null; while(q.length){ const c = q.shift(); if(c===g.goal){ hit = c; break; } for(let d=0;d<4;d++){ const n = slide(c,d); if(!prev.has(n)){ prev.set(n,[c,d]); q.push(n); } } }
    if(hit==null) return null; let c = hit, d = null; while(prev.get(c)!==-1){ const [p,dd] = prev.get(c); d = dd; c = p; } return document.querySelector(`.rziarr[data-d="${d}"]`); });
}

/* ---------- Number train / Letter train ---------- */
RZ_MAKE.numtrain = function(){ const e = easy(); let seq, kind;
  if(e){ const s = 1 + Math.floor(Math.random()*5); seq = [0,1,2,3,4].map(i=>s+i); kind = 'up'; }
  else { kind = rzOne(['up','twos','down']); if(kind==='up'){ const s = 3 + Math.floor(Math.random()*12); seq = [0,1,2,3,4,5].map(i=>s+i); } else if(kind==='twos'){ const s = 2*(1+Math.floor(Math.random()*4)); seq = [0,1,2,3,4].map(i=>s+2*i); } else { const s = 10 + Math.floor(Math.random()*6); seq = [0,1,2,3,4,5].map(i=>s-i); } }
  const hole = 1 + Math.floor(Math.random()*(seq.length-2)), ans = seq[hole]; const opts = cshuf([ans, ans+1, ans-1, ans+2].filter((v,i,a)=>v>0 && a.indexOf(v)===i)).slice(0,3); if(!opts.includes(ans)) opts[0] = ans;
  return {type:'numtrain', title: kind==='twos' ? 'Count by twos! Which number is missing?' : kind==='down' ? 'Counting down! Which number is missing?' : 'Which number is missing from the train?', seq, holes:[hole], opts:[cshuf(opts)], sig:kind+seq.join(',')+':'+hole}; };
RZ_MAKE.abctrain = function(){ const e = easy(), A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', low = !e && Math.random()<.5, n = e ? 4 : 5, s = Math.floor(Math.random()*(26-n));
  let seq = A.slice(s, s+n).split(''); if(low) seq = seq.map(x=>x.toLowerCase());
  const holes = e ? [1 + Math.floor(Math.random()*(n-2))] : cshuf([1,2,3].filter(i=>i<n-1)).slice(0, 2).sort();
  const opts = holes.map(h=>{ const a = seq[h]; const pool = (low ? A.toLowerCase() : A).split('').filter(x=>x!==a); return cshuf([a, ...cshuf(pool).slice(0, e ? 2 : 3)]); });
  return {type:'abctrain', title: holes.length>1 ? 'Two letters fell off the train! Put them back.' : 'Which letter is missing from the train?', seq, holes, opts, sig:seq.join('')+':'+holes.join(',')}; };
function rzTrainPlay(g){

/* ---------- Key and gate maze ---------- */
RZ_MAKE.keymaze = function(){ const e = easy(), W = e ? 8 : 12, H = e ? 5 : 7, nk = e ? 1 : 2;
  for(let t=0; t<60; t++){ const wall = rzMazeGen(W, H, 0), start = 0, dist = rzBfs(wall, W, H, start), goal = dist.indexOf(Math.max(...dist));
    const path = rzPath(wall, W, H, start, goal); if(path.length < 8) continue;
    // gates sit on the solution path; each key sits in a dead end off the path before its gate
    const onPath = new Set(path), gates = [], keys = [];
    for(let i=0;i<nk;i++){ const gi = Math.floor(path.length*(i+1)/(nk+1)); gates.push(path[gi]); }
    let okk = true;
    for(let i=0;i<nk;i++){ const before = new Set(path.slice(0, path.indexOf(gates[i]))); const blocked = new Set(gates.slice(i));
      // cells reachable from start without crossing gates i..: pick a far one off the path
      const seen = new Map([[start,0]]), q = [start]; const D = [[0,-1],[1,0],[0,1],[-1,0]];
      while(q.length){ const c = q.shift(), x = c%W, y = (c/W)|0; for(let d=0;d<4;d++) if(!wall[c][d]){ const n = (y+D[d][1])*W + x+D[d][0]; if(!seen.has(n) && !blocked.has(n)){ seen.set(n, seen.get(c)+1); q.push(n); } } }
      const cand = [...seen.entries()].filter(([c,v])=>!onPath.has(c) && !keys.includes(c) && v>=3).sort((a,b)=>b[1]-a[1]); if(!cand.length){ okk = false; break; } keys.push(cand[Math.floor(Math.random()*Math.min(4,cand.length))][0]); }
    if(!okk) continue;
    return {type:'keymaze', title: nk>1 ? 'Find the keys to open the gates, then reach the treasure!' : 'Find the key to open the gate, then reach the treasure!', W, H, wall, start, goal, gems:[], gates, keys, sig:'k'+W+'x'+H+':'+wall.map(w=>w[1]+''+w[2]).join('')+':'+gates.join(',')+':'+keys.join(',')}; }
  return RZ_MAKE.bigmaze(); };
function rzKeyMazePlay(g){

  const seal = (k, on, orig)=>{ const x = k%W, y = (k/W)|0; for(let d=0; d<4; d++){ const nx = x+D[d][0], ny = y+D[d][1]; if(nx<0||ny<0||nx>=W||ny>=g.H) continue; const n = ny*W+nx;
    const v = on ? 1 : orig[d]; g.wall[k][d] = v; g.wall[n][(d+2)%4] = v; } };
  g.gates.forEach(k=>seal(k, true));
  rzMazePlay(g, CITIES.rz); const box = document.getElementById('rzm'); if(!box) return;
  const cs = box.offsetWidth / W, held = new Set();
  const lay = document.createElement('div'); lay.className = 'rzkl'; box.appendChild(lay);
  const draw = ()=>{ lay.innerHTML = g.keys.map((k,i)=>held.has(i) ? '' : `<i style="left:${(k%W)*cs}px;top:${((k/W)|0)*cs}px;width:${cs}px;height:${cs}px;font-size:${cs*.62}px">${['🔑','🗝️'][i]}</i>`).join('')
    + g.gates.map((k,i)=>held.has(i) ? '' : `<i class="gate" style="left:${(k%W)*cs}px;top:${((k/W)|0)*cs}px;width:${cs}px;height:${cs}px;font-size:${cs*.62}px">🔒</i>`).join(''); };

  let last = g.start;
  const mo = new MutationObserver(()=>{ const c = bugCell(); if(c===last) return;
    // a tap can slide along a corridor: check every cell passed on the way
    const cells = []; const ax = last%W, ay = (last/W)|0, bx = c%W, by = (c/W)|0;

/* ---------- Number path ---------- */
RZ_MAKE.numpath = function(){ const e = easy(), W = e ? 4 : 6, H = e ? 3 : 5, len = e ? 6 : 14;
  for(let t=0;t<300;t++){ const start = Math.floor(Math.random()*W*H), path = [start], seen = new Set([start]);
    while(path.length < len){ const c = path[path.length-1], x = c%W, y = Math.floor(c/W); const nb = cshuf([[1,0],[-1,0],[0,1],[0,-1]]).map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>a>=0&&b>=0&&a<W&&b<H&&!seen.has(b*W+a));
      if(!nb.length) break; const [a,b] = nb[0]; path.push(b*W+a); seen.add(b*W+a); }
    if(path.length < len) continue;
    const cell = Array(W*H).fill(null); path.forEach((k,i)=>cell[k] = i+1);
    // other squares: blank on Easy; on Challenge, decoy numbers that are NOT next door to the right place
    if(!e) for(let k=0;k<W*H;k++) if(cell[k]==null){ const x = k%W, y = Math.floor(k/W); const near = path.map((p,i)=>[p,i+1]).filter(([p])=>Math.abs(p%W - x) + Math.abs(Math.floor(p/W) - y)===1).map(([p,v])=>v);
      const cand = [...Array(len).keys()].map(i=>i+1).filter(v=>v>1 && !near.some(n=>Math.abs(n-v)===1)); cell[k] = cand.length && Math.random()<.8 ? rzOne(cand) : null; }
    return {type:'numpath', title: e ? 'Number path! Tap 1, 2, 3... each one next door.' : 'Number path! Follow 1 to 14, always next door. Watch for tricks!', W, H, cell, path, len, sig:W+'x'+H+':'+path.join(',')}; }
  return RZ_MAKE.numtrain(); };
function rzNumPathPlay(g){
  const {W, H} = g, cs = Math.min(Math.floor(640/W), Math.floor(400/H)), L = Math.round(512 - W*cs/2);
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">Start at 1!</div>
    <div class="rznpg" style="left:${L}px;width:${W*cs}px;grid-template-columns:repeat(${W},${cs}px)">${g.cell.map((v,k)=>`<button class="rznpc ${v==null?'blank':''}" data-k="${k}" style="height:${cs}px;font-size:${cs*.45}px" aria-label="${v==null?'Empty':v}">${v==null?'':v}</button>`).join('')}</div>`);
  let k = 0; const step = ()=>document.querySelector(`.rznpc[data-k="${g.path[k]}"]`);
  document.querySelectorAll('.rznpc').forEach(b=>b.onclick=()=>{ if(!G.live) return; const kk = +b.dataset.k;
    if(kk===g.path[k]){ poke(); b.classList.add('on'); if(k>0) document.querySelector(`.rznpc[data-k="${g.path[k-1]}"]`).classList.add('trail'); k++; tone(440+k*30,.08,'triangle',.13); if(k<=20) lsoft(String(k), ['N:'+k]);
      document.getElementById('cnt').textContent = k>=g.len ? 'You followed the whole path!' : `Next: ${k+1}`; if(k>=g.len){ clearHint(); G.getT = null; rzDoneLater(1000); } }
    else { miss(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); tone(220,.1,'sine',.08); } });
  armHint(step);
}

/* ===== update.js (v23.19): the tablet app tells grown-ups when a newer version is out.
   Only inside the app (window.TLB_APP). Once per launch it reads a tiny version file from the game's GitHub page
   (no data is sent, nothing is stored about the player). If it is newer than this app (window.TLB_CODE, set by the app),
   a "New version ready" pill shows on the start screen; tapping it hands the download link to the tablet's browser. ===== */
let TLB_NEWER = null, TLB_CHECKED = false;
function tlbCheckUpdate(){ if(!window.TLB_APP || TLB_CHECKED) return; TLB_CHECKED = true;
  fetch('https://raw.githubusercontent.com/robertgblairjr-afk/traveling-ladybugs-app/main/version.json?t=' + Date.now(), {cache:'no-store'})
    .then(r=>r.ok ? r.json() : null).then(v=>{ if(v && +v.code > +(window.TLB_CODE||0)){ TLB_NEWER = v; tlbShowUpdate(); } }).catch(()=>{}); }
function tlbShowUpdate(){ const scr = app.querySelector('.worldtitle'); if(!scr || !TLB_NEWER || scr.querySelector('#tlbupd')) return;
  const a = document.createElement('a'); a.id = 'tlbupd'; a.href = TLB_APK_URL; a.className = 'tlbupd';
  a.innerHTML = `<b>&#127881; New version ${TLB_NEWER.name||''} is ready!</b><small>Grown-ups: tap to download, then tap Install. Progress is kept.</small>`;
  scr.appendChild(a); }
{ const base = showTitle; showTitle = function(){ const r = base.apply(this, arguments); tlbCheckUpdate(); tlbShowUpdate(); return r; }; }

  const order = FLY_MAPS.slice(); const st = Math.floor(Math.random()*order.length); const maps = order.slice(st).concat(order.slice(0, st));
  const imgs = {}; const img = k=>{ if(!imgs[k]){ const im = new Image(); im.src = BG_CITY[k][0]; imgs[k] = im; } return imgs[k]; };
  maps.slice(0,3).forEach(m=>img(m[0]));

  let state = 'ready', t0 = 0, last = 0, dist = 0, bgx = 0, speed = little ? 150 : 175, score = 0, hearts = little ? 5 : 3, gates = [], nextGate = 700, curMap = -1, puffs = [], tick = 0;

  hud();
  const seamClouds = k=>{ const r = []; let s = k*9301+49297; const rnd = ()=>{ s = (s*9301+49297)%233280; return s/233280; }; for(let i=0;i<16;i++) r.push([ (rnd()-.5)*150, rnd()*H, 50+rnd()*60 ]); return r; };
  const seams = {};
  function drawBg(){
    const first = Math.floor(bgx / MW);
    for(let k=first; k<=first+1; k++){
      const m = maps[((k%maps.length)+maps.length)%maps.length], im = img(m[0]), x = k*MW - bgx;
      if(im.complete && im.naturalWidth) g.drawImage(im, x, 0, MW, H); else { g.fillStyle = '#CFE8F5'; g.fillRect(x, 0, MW, H); }
      img(maps[(((k+1)%maps.length)+maps.length)%maps.length][0]);
    }
    // the hand-over: a soft white haze and a bank of clouds over each seam
    for(let k=first; k<=first+1; k++){ const sx = k*MW - bgx; if(sx < -260 || sx > W+260 || k===0) continue;
      const gr = g.createLinearGradient(sx-200, 0, sx+200, 0); gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(.5,'rgba(255,255,255,.85)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(sx-200, 0, 400, H);
      (seams[k] = seams[k] || seamClouds(k)).forEach(([dx,y,r])=>{ g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.arc(sx+dx, y, r, 0, 7); g.fill(); }); }
    const here = Math.floor((bgx + P.x) / MW); if(here !== curMap){ curMap = here; const m = maps[((here%maps.length)+maps.length)%maps.length]; const pl = document.getElementById('flyplace'); if(pl){ pl.textContent = 'Flying over ' + m[1] + '!'; pl.classList.remove('on'); void pl.offsetWidth; pl.classList.add('on'); } }
  }
  function stem(x, y0, y1, top){ // a flower stem with leaves; the flower faces the gap
    g.fillStyle = '#4C9A2A'; g.strokeStyle = '#2F6B1A'; g.lineWidth = 4;
    const h = y1 - y0; g.beginPath(); g.roundRect ? g.roundRect(x-16, y0, 32, h, 14) : g.rect(x-16, y0, 32, h); g.fill(); g.stroke();
    for(let yy = y0+40; yy < y1-50; yy += 90){ const s = ((yy/90)|0)%2 ? 1 : -1; g.fillStyle = '#6BBF3A'; g.beginPath(); g.ellipse(x+s*30, yy, 26, 11, s*.5, 0, 7); g.fill(); g.stroke(); }
    const fy = top ? y1 : y0, cols = ['#FF6FA5','#FFB703','#9B5DE5','#FF7F11'], c = cols[Math.abs(Math.round(x/97))%4];
