  <div style="position:absolute;left:20px;bottom:18px;display:flex;align-items:flex-end;gap:2px;z-index:3">${lisaSVG('cheer',210)}${lucasSVG('cheer',205)}</div>
  <div style="position:absolute;right:20px;bottom:24px;display:flex;align-items:flex-end;gap:8px;z-index:3">${c.culprit.svg(100)}${c.lost.svg(88)}${friendEl(c.friend,170)}</div>
  <div style="position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:9;display:none;text-align:center" id="fend"><div style="background:#fff;border-radius:22px;padding:10px 20px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.12);margin-bottom:10px;font-size:22px">&#9733; ${sumStars(st.stars)} of 12 stars</div><button class="big gold" id="fagain">Choose another city</button></div></div>`;
  cbind(); music.play('party'); confetti(); sfx.win();
  setTimeout(()=>sayChain([['lucas', llCity(id)], ['f', c.friend, c.L.yay]]), 700);
  let n = 0, hits = 0;
  const finish = ()=>setTimeout(()=>{ sayChain([['lisa', 8], ['f', c.friend, c.L.bye], ['lucas', 10]]); document.getElementById('fb').style.display='none'; document.getElementById('fend').style.display='block'; confetti(); }, 900);
  app.querySelectorAll('.fin').forEach(b=>b.onclick=()=>{

      if(hits>=5){ b.classList.add('burst'); confetti(); sfx.win(); finish(); } return; }

    if(n===N) finish();

}

/* ================= v18: learning mini-games (ABC + 123) ================= */
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
/* Lisa's recorded learning voice: parts like 'L:B', 'N:7', 'W:pizza', 'Q:1'. Until the files exist, the built-in voice reads the text. */
const LVO = {ready:true};
const LV_HAVE = new Set(Object.keys(LV_SPRITE));
function lvKey(p){ const [k,v] = p.split(':'); return k==='Q' ? 'Q_'+String(v).padStart(2,'0') : k+'_'+String(v).toLowerCase(); }
function lbusy(){ try{ return !!voSrc || speechSynthesis.speaking; }catch(e){ return !!voSrc; } }
function lsoft(t, parts){ if(!lbusy()) lsay(t, parts); }
function lwait(t, parts, tries){ tries = tries||0; if(lbusy() && tries<40) return setTimeout(()=>lwait(t, parts, tries+1), 100); lsay(t, parts); }
function lsay(t, parts){ if(!soundOn) return; if(LVO.ready && parts && parts.length && parts.every(p=>LV_HAVE.has(lvKey(p)))) sayChain(parts.map(p=>['v', lvKey(p)])); else say(t, 'lisa'); }
function lpick(arr, n, not){ return cshuf(arr.filter(x=>!(not||[]).includes(x))).slice(0, n); }
function lfinish(id, i){ clearHint(); G.getT = null; G.live && setTimeout(()=>cityDone(id, i), 900); }
function lgood(){ tone(784,.12,'triangle',.16); tone(1047,.16,'triangle',.14,.1); }
function lbad(b){ miss(); sfx.oops(); if(b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } if(Math.random()<0.5) llMaybe('lisa', 6); }
function lshell(id, i, g, inner){ cgameShell(id, i, CITIES[id].stops[i].scene(), inner); }
const SHAPE = {
  circle:(c,s)=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}"><circle cx="50" cy="50" r="40" fill="${c}" stroke="#1D1D2B" stroke-width="4"/></svg>`,
  triangle:(c,s)=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}"><path d="M50 10 L92 88 H8 Z" fill="${c}" stroke="#1D1D2B" stroke-width="4" stroke-linejoin="round"/></svg>`,
  square:(c,s)=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}"><rect x="12" y="12" width="76" height="76" rx="6" fill="${c}" stroke="#1D1D2B" stroke-width="4"/></svg>`,
  star:(c,s)=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}"><path d="M50 6 L62 38 L96 38 L68 58 L79 92 L50 72 L21 92 L32 58 L4 38 L38 38 Z" fill="${c}" stroke="#1D1D2B" stroke-width="4" stroke-linejoin="round"/></svg>`,
  heart:(c,s)=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}"><path d="M50 88 C10 60 6 34 22 22 C34 13 46 20 50 30 C54 20 66 13 78 22 C94 34 90 60 50 88Z" fill="${c}" stroke="#1D1D2B" stroke-width="4"/></svg>`
};
const SHCOL = ['#E5383B','#2B7BE4','#FFD23F','#2A9D8F','#9B5DE5','#FF7F11'];
const one = (g, n)=> n===1 ? (g.one || g.name.replace(/s$/,'')) : g.name;
const pic = (e, s)=>`<span class="lpic" style="font-size:${s||64}px">${e}</span>`;

/* ---- one engine for "listen, then tap the right answer" games ---- */
function gRounds(id, i, g, make){
  const R = easy() ? (g.easyN||3) : (g.bigN||5); let k = 0;
  lshell(id, i, g, `<div class="counter" id="cnt">1 / ${R}</div><div class="lboard" id="lb"></div>`);
  const lb = document.getElementById('lb');
  function show(){
    const r = make(k, easy()); const ok = r.opts.findIndex(o=>o.ok);
    lb.innerHTML = `<div class="lq">${r.q}</div><div class="lopts">${r.opts.map((o,j)=>`<button class="lopt" data-j="${j}" aria-label="Answer">${o.h}</button>`).join('')}</div>`;
    if(r.say) setTimeout(()=>lwait(r.say, r.vo), 250);
    armHint(()=>lb.querySelector(`.lopt[data-j="${ok}"]`));
    lb.querySelectorAll('.lopt').forEach(b=>b.onclick=()=>{
      if(!G.live) return; const o = r.opts[+b.dataset.j];
      if(o.ok){ poke(); b.classList.add('right'); lgood(); k++; document.getElementById('cnt').textContent = `${Math.min(k+1,R)} / ${R}`;
        lb.querySelectorAll('.lopt').forEach(x=>x.disabled = true);
        if(k>=R) lfinish(id, i); else setTimeout(show, 900); }
      else { lbad(b); if(o.say) lsoft(o.say, o.vo); }
    });
  }
  show();
}

/* ABC: find the letter */
function gLetter(id, i, g){
  gRounds(id, i, g, (k, e)=>{ const t = g.letters[k % g.letters.length]; const n = e ? 3 : 6;
    const others = lpick((g.look||ABC).split(''), n-1, [t]);
    return {q:`<div class="lbig">${t}</div><div class="lsub">Find the letter ${t}!</div>`, say:`Find the letter ${t}.`, vo:['Q:1','L:'+t],
      opts: cshuf([t, ...others]).map(x=>({h:`<span class="lletter">${x}</span>`, ok:x===t, say:x, vo:['L:'+x]}))}; });
}
/* ABC: uppercase meets lowercase */
function gCase(id, i, g){
  gRounds(id, i, g, (k, e)=>{ const t = g.letters[k % g.letters.length]; const n = e ? 3 : 4;
    const others = lpick((g.look||ABC).split(''), n-1, [t]).map(x=>x.toLowerCase());
    return {q:`<div class="lbig">${t}</div><div class="lsub">Which one is little ${t.toLowerCase()}?</div>`, say:`Big ${t}. Can you find little ${t}?`, vo:['L:'+t,'Q:2'],
      opts: cshuf([t.toLowerCase(), ...others]).map(x=>({h:`<span class="lletter">${x}</span>`, ok:x===t.toLowerCase()}))}; });
}
/* ABC: beginning sounds */
function gFirst(id, i, g){
  gRounds(id, i, g, (k, e)=>{ const [em, word] = g.words[k % g.words.length]; const t = word[0].toUpperCase(); const n = e ? 3 : 4;
    const others = lpick(ABC.split(''), n-1, [t]);
    return {q:`${pic(em, 86)}<div class="lsub">${word}</div>`, say:`${word}. What letter does ${word} start with?`, vo:['W:'+word,'Q:3'],
      opts: cshuf([t, ...others]).map(x=>({h:`<span class="lletter">${x}</span>`, ok:x===t}))}; });
}
/* ABC: rhyming */
function gRhyme(id, i, g){
  gRounds(id, i, g, (k, e)=>{ const r = g.sets[k % g.sets.length]; const wrong = e ? r.no.slice(0,1) : r.no;
    return {q:`${pic(r.a[0], 80)}<div class="lsub">What rhymes with <b>${r.a[1]}</b>?</div>`, say:`What rhymes with ${r.a[1]}?`, vo:['Q:4','W:'+r.a[1]],
      opts: cshuf([[...r.yes, true], ...wrong.map(w=>[...w, false])]).map(([em, w, ok])=>({h:`${pic(em, 60)}<small>${w}</small>`, ok, say:w, vo:['W:'+w]}))}; });
}
/* 123: count the things */
function gCount(id, i, g){
  gRounds(id, i, g, (k, e)=>{ const max = e ? 5 : 10, min = e ? 1 : 3; const seq = g.seq || []; let n = seq[k] || (min + Math.floor(Math.random()*(max-min+1)));
    n = Math.min(max, Math.max(min, n)); const opts = new Set([n]); while(opts.size < (e?3:4)){ const v = n + Math.floor(Math.random()*5) - 2; if(v>=1 && v<=max+1) opts.add(v); }
    return {q:`<div class="lrow">${Array.from({length:n},()=>pic(g.item, n>6?42:52)).join('')}</div><div class="lsub">How many ${g.name}?</div>`, say:`How many ${g.name} can you count?`, vo:['Q:5'],
      opts: cshuf([...opts]).map(v=>({h:`<span class="lnum">${v}</span>`, ok:v===n, say:String(v), vo:['N:'+v]}))}; });
}
/* 123: find the number */
function gNumFind(id, i, g){
  gRounds(id, i, g, (k, e)=>{ const t = g.nums[k % g.nums.length] - (e && g.nums[k % g.nums.length] > 10 ? 10 : 0); const top = e ? 10 : 20; const n = e ? 3 : 5;
    const pool = Array.from({length:top},(_,x)=>x+1); const others = lpick(pool, n-1, [t]);
    const vis = e ? `<div class="ldots">${'&#9679;'.repeat(t)}</div>` : '';
    return {q:`<div class="lsub">Find the number</div><div class="lbig">${t}</div>${vis}`, say:`Find the number ${t}.`, vo:['Q:6','N:'+t],
      opts: cshuf([t, ...others]).map(v=>({h:`<span class="lnum">${v}</span>`, ok:v===t, say:String(v), vo:['N:'+v]}))}; });
}
/* 123: more or fewer */
function gMore(id, i, g){
  gRounds(id, i, g, (k, e)=>{ let a = 1 + Math.floor(Math.random()*(e?5:9)), b; do{ b = 1 + Math.floor(Math.random()*(e?5:9)); }while(Math.abs(a-b) < (e?2:1));
    const fewer = !e && k%2===1; const want = fewer ? Math.min(a,b) : Math.max(a,b);
    const grp = n=>`<div class="lgroup">${Array.from({length:n},()=>pic(g.item, 38)).join('')}</div>`;
    return {q:`<div class="lsub">Which ${g.place} has <b>${fewer?'fewer':'more'}</b> ${g.name}?</div>`, say:`Which ${g.place} has ${fewer?'fewer':'more'} ${g.name}?`, vo:[fewer?'Q:8':'Q:7'],
      opts:[a,b].map(v=>({h:grp(v), ok:v===want}))}; });
}
/* 123: adding with pictures */
function gAdd(id, i, g){
  gRounds(id, i, g, (k, e)=>{ const max = e ? 5 : 10; const a = 1 + Math.floor(Math.random()*(max-2)), b = 1 + Math.floor(Math.random()*(max-a)); const s = a+b;
    const opts = new Set([s]); while(opts.size < 3){ const v = s + [-2,-1,1,2][Math.floor(Math.random()*4)]; if(v>=1) opts.add(v); }
    const row = n=>Array.from({length:n},()=>pic(g.item, 40)).join('');
    return {q:`<div class="lrow">${row(a)}<b class="lop">+</b>${row(b)}<b class="lop">=</b><b class="lop">?</b></div><div class="lsub">${a} ${one(g,a)} and ${b} more. How many ${g.name} in all?</div>`,
      say:`${a} plus ${b}. How many ${g.name} in all?`, vo:['N:'+a,'Q:9','N:'+b,'Q:10'], opts: cshuf([...opts]).map(v=>({h:`<span class="lnum">${v}</span>`, ok:v===s, say:String(v), vo:['N:'+v]}))}; });
}
/* 123: what comes next? */
function gPattern(id, i, g){
  gRounds(id, i, g, (k, e)=>{ const P = g.pats[k % g.pats.length]; const unit = e ? P.slice(0,2) : P; const len = e ? 5 : 7;
    const seq = Array.from({length:len},(_,x)=>unit[x % unit.length]); const ans = unit[len % unit.length];
    const opts = cshuf([...new Set([ans, ...g.extra, ...P])]).slice(0, 3); if(!opts.includes(ans)) opts[0] = ans;
    return {q:`<div class="lrow">${seq.map(x=>pic(x, 48)).join('')}<span class="lqm">?</span></div><div class="lsub">What comes next?</div>`, say:`What comes next in the pattern?`, vo:['Q:11'],
      opts: cshuf(opts).map(x=>({h:pic(x, 60), ok:x===ans}))}; });
}

/* ---- tap-around games ---- */
function scatter(n, W, H, pad){ const pts = []; let tries = 0; while(pts.length < n && tries < 4000){ tries++; const p = [pad + Math.random()*(W-2*pad), pad + Math.random()*(H-2*pad)]; if(pts.every(q=>Math.hypot(q[0]-p[0], q[1]-p[1]) > pad*1.9)) pts.push(p); } return pts; }
function lfield(items){ return `<div class="lfield lpanel">${items.map((it,k)=>`<button class="lit" data-k="${k}" style="left:${it.x}px;top:${it.y}px;--r:${it.r||0}deg;animation-delay:-${(k*.37).toFixed(2)}s" aria-label="${it.lab||'Tap'}">${it.h}</button>`).join('')}</div>`; }
/* ABC: pop every balloon with the letter */
function gLetterPop(id, i, g){
  const e = easy(), N = e ? 8 : 12, T = e ? 3 : 5, t = g.letter; const lows = !e;
  const targets = Array.from({length:T},(_,k)=> lows && k%2 ? t.toLowerCase() : t);
  const others = lpick((g.look||ABC).split(''), N-T, [t]).map((x,k)=> lows && k%3===0 ? x.toLowerCase() : x);
  const pts = scatter(N, 860, 440, 52), cols = ['#E5383B','#2B7BE4','#FFD23F','#2A9D8F','#9B5DE5','#FF7F11'];
  const items = cshuf([...targets, ...others]).map((x,k)=>({x:pts[k][0]-46, y:pts[k][1]-50, lab:'Balloon '+x, h:`<svg viewBox="0 0 100 120" width="92" height="110"><ellipse cx="50" cy="46" rx="38" ry="44" fill="${cols[k%6]}"/><path d="M46 90 L54 90 L50 97 Z" fill="${cols[k%6]}"/><path d="M50 97 Q44 108 52 120" stroke="#555" stroke-width="2" fill="none"/><text x="50" y="62" text-anchor="middle" font-family="Baloo 2,Arial" font-weight="800" font-size="46" fill="#fff">${x}</text></svg>`, ok:x.toUpperCase()===t}));
  lshell(id, i, g, `<div class="counter" id="cnt">Popped: 0 / ${T}</div>${lfield(items)}`);
  setTimeout(()=>lwait(e ? `Pop all the balloons with the letter ${t}.` : `Pop every ${t}. Big ${t} and little ${t}!`, e ? ['Q:12','L:'+t] : ['Q:13','L:'+t]), 300);
  let n = 0; armHint(()=>[...app.querySelectorAll('.lit:not(.pop)')].find(b=>items[+b.dataset.k].ok));
  app.querySelectorAll('.lit').forEach(b=>b.onclick=()=>{ if(!G.live || b.classList.contains('pop')) return; const it = items[+b.dataset.k];
    if(it.ok){ poke(); b.classList.add('pop'); n++; tone(600+n*120,.1,'square',.1); document.getElementById('cnt').textContent = `Popped: ${n} / ${T}`; if(n===T) lfinish(id, i); }
    else lbad(b); });
}
/* ABC: tap the letters in ABC order */
function gAbcOrder(id, i, g){
  const e = easy(), s = ABC.indexOf(e ? g.easy : g.big), N = e ? 4 : 6, seq = ABC.slice(s, s+N).split('');
  const pts = scatter(N, 860, 440, 66);
  const items = seq.map((x,k)=>({x:pts[k][0]-55, y:pts[k][1]-55, lab:'Letter '+x, h:`<span class="lbub" style="background:${SHCOL[k%6]}">${x}</span>`}));
  lshell(id, i, g, `<div class="counter" id="cnt">Start with ${seq[0]}</div>${lfield(items)}`);
  setTimeout(()=>lwait(`Tap the letters in A B C order. Start with ${seq[0]}.`, ['Q:14','L:'+seq[0]]), 300);
  let nx = 0; const hintEl = ()=>app.querySelector(`.lit[data-k="${nx}"]`); armHint(hintEl);
  if(e) setTimeout(()=>{ const h = hintEl(); h && h.classList.add('glow'); }, 50);
  app.querySelectorAll('.lit').forEach(b=>b.onclick=()=>{ if(!G.live || b.classList.contains('got')) return; const k = +b.dataset.k;
    if(k===nx){ poke(); b.classList.remove('glow'); b.classList.add('got'); tone(523*Math.pow(2,nx/12*2),.18,'triangle',.15); lsay(seq[k], ['L:'+seq[k]]); nx++;
      document.getElementById('cnt').textContent = nx<N ? `Next: ?` : 'A B C!'; if(nx===N) lfinish(id, i); else if(e){ const h = hintEl(); h && h.classList.add('glow'); } }
    else lbad(b); });
}
/* ABC: spell the word */
function gSpell(id, i, g){
  const e = easy(), words = e ? g.words.slice(0,1) : g.words; let w = 0;
  lshell(id, i, g, `<div class="counter" id="cnt">Word 1 / ${words.length}</div><div class="lboard" id="lb"></div>`);
  const lb = document.getElementById('lb');
  function show(){
    const [em, word] = words[w], L = word.toUpperCase().split(''); let pos = 0;
    const tiles = cshuf([...L, ...(e ? [] : lpick(ABC.split(''), 2, L))]);
    lb.innerHTML = `${pic(em, 80)}<div class="lslots">${L.map((x,k)=>`<span class="lslot" data-k="${k}">${e?`<i>${x}</i>`:''}</span>`).join('')}</div><div class="lopts">${tiles.map((x,k)=>`<button class="lopt ltile" data-x="${x}" data-k="${k}">${x}</button>`).join('')}</div>`;
    setTimeout(()=>lwait(`Let's spell ${word}. ${L.join(', ')}.`, ['Q:15','W:'+word]), 250);
    const nextTile = ()=>lb.querySelector(`.ltile[data-x="${L[pos]}"]:not(.used)`); armHint(nextTile);
    lb.querySelectorAll('.ltile').forEach(b=>b.onclick=()=>{ if(!G.live || b.classList.contains('used')) return;
      if(b.dataset.x===L[pos]){ poke(); b.classList.add('used'); const sl = lb.querySelector(`.lslot[data-k="${pos}"]`); sl.innerHTML = L[pos]; sl.classList.add('on'); tone(660+pos*110,.12,'triangle',.15); if(LVO.ready) sayChain([['v','L_'+L[pos].toLowerCase()]]); pos++;
        if(pos===L.length){ lgood(); lsay(`${word}! You spelled ${word}!`, ['W:'+word,'Q:16']); w++; if(w>=words.length) lfinish(id, i); else { document.getElementById('cnt').textContent = `Word ${w+1} / ${words.length}`; setTimeout(show, 1600); } } }
      else lbad(b); });
  }
  show();
}
/* 123: smallest to biggest */
function gSort(id, i, g){
  const e = easy(), N = e ? 3 : 5, sizes = Array.from({length:N},(_,k)=>40 + k*(e?34:22)), order = cshuf(sizes.map((_,k)=>k));
  const W = 860, gap = W/N;
  const items = order.map((k,j)=>({x:gap*j + gap/2 - 70, y:250 - sizes[k]/2, lab:'Size', h:pic(g.item, sizes[k]), size:k}));
  lshell(id, i, g, `<div class="counter" id="cnt">Smallest first!</div>${lfield(items)}`);
  setTimeout(()=>lwait(`Tap the ${g.name} from smallest to biggest.`, ['Q:17']), 300);
  let nx = 0; armHint(()=>[...app.querySelectorAll('.lit')].find(b=>items[+b.dataset.k].size===nx));
  app.querySelectorAll('.lit').forEach(b=>b.onclick=()=>{ if(!G.live || b.classList.contains('got')) return; const it = items[+b.dataset.k];
    if(it.size===nx){ poke(); b.classList.add('got'); b.insertAdjacentHTML('beforeend', `<b class="lsortn">${nx+1}</b>`); tone(392*Math.pow(2,nx*2/12),.16,'triangle',.15); nx++; if(nx===N) lfinish(id, i); }
    else lbad(b); });
}
/* 123: find all the shapes */
function gShapes(id, i, g){
  const e = easy(), N = e ? 7 : 11, T = e ? 3 : 5, kinds = Object.keys(SHAPE).filter(x=>x!==g.shape);
  const list = cshuf([...Array(T).fill(g.shape), ...Array.from({length:N-T},(_,k)=>kinds[k % kinds.length])]);
  const pts = scatter(N, 860, 440, 52);
  const items = list.map((sh,k)=>({x:pts[k][0]-45, y:pts[k][1]-45, r:(k*37)%30-15, lab:sh, h:SHAPE[sh](SHCOL[(k*5)%6], 90), ok:sh===g.shape}));
  lshell(id, i, g, `<div class="counter" id="cnt">Found: 0 / ${T}</div>${lfield(items)}`);
  setTimeout(()=>lwait(`Find all the ${g.shape}s!`, [g.shape==='star'?'Q:19':'Q:18']), 300);
  let n = 0; armHint(()=>[...app.querySelectorAll('.lit:not(.got)')].find(b=>items[+b.dataset.k].ok));
  app.querySelectorAll('.lit').forEach(b=>b.onclick=()=>{ if(!G.live || b.classList.contains('got')) return; const it = items[+b.dataset.k];
    if(it.ok){ poke(); b.classList.add('got'); n++; tone(660+n*100,.12,'triangle',.15); document.getElementById('cnt').textContent = `Found: ${n} / ${T}`; if(n===T) lfinish(id, i); }
    else { lbad(b); lsoft(`That's a ${it.lab}.`, ['Q:'+({circle:20,square:21,heart:22,triangle:23,star:24})[it.lab]]); } });
}
/* 123: tap it the right number of times */
function gTapCount(id, i, g){
  const e = easy(), list = e ? g.easy : g.big; let r = 0;
  lshell(id, i, g, `<div class="counter" id="cnt">1 / ${list.length}</div><div class="lboard" id="lb"></div>`);
  const lb = document.getElementById('lb');
  function show(){
    const N = list[r]; let n = 0;
    lb.innerHTML = `<div class="lsub">${g.verb} <b class="lnumi">${N}</b> times!</div>${e?`<div class="ltally">${Array.from({length:N},(_,k)=>`<span data-k="${k}"></span>`).join('')}</div>`:'<div class="ltally lcountup" id="lcu">0</div>'}
      <button class="ldrum" id="ldr" aria-label="${g.name}">${pic(g.item, 120)}</button>${e?'':'<button class="big green" id="ldone">Done!</button>'}`;
    setTimeout(()=>lwait(`${g.verb} ${N} times!`, [g.item==='&#128056;'?'Q:26':'Q:25','N:'+N,'Q:27']), 250);
    const dr = document.getElementById('ldr'); armHint(()=>e || n<N ? dr : document.getElementById('ldone'));
    dr.onclick = ()=>{ if(!G.live) return; poke(); n++; dr.classList.remove('bop'); void dr.offsetWidth; dr.classList.add('bop'); tone(g.pitch||220, .12, g.wave||'square', .14); lsay(String(n), ['N:'+n]);
      if(e){ const d = lb.querySelector(`.ltally span[data-k="${n-1}"]`); d && d.classList.add('on'); if(n===N) next(); }
      else { document.getElementById('lcu').textContent = n; if(n > N + 2){ lbad(dr); n = 0; document.getElementById('lcu').textContent = 0; } } };
    const dn = document.getElementById('ldone'); if(dn) dn.onclick = ()=>{ if(n===N) next(); else { lbad(dn); lwait(n<N ? 'A few more!' : 'Too many! Let\'s try again.', [n<N?'Q:28':'Q:29']); n = 0; document.getElementById('lcu').textContent = 0; } };
    function next(){ lgood(); r++; lb.querySelectorAll('button').forEach(x=>x.disabled = true); if(r>=list.length) lfinish(id, i); else { document.getElementById('cnt').textContent = `${r+1} / ${list.length}`; setTimeout(show, 1000); } }
  }
  show();
}

{ const base = cityGame;
  cityGame = function(id, i){ const g = CITIES[id].stops[i].game;

}

const FXR = (s=>()=>(s = (s*16807)%2147483647)/2147483647)(7);

const FXA = {
  bird:(s,c)=>`<g transform="scale(${s||1})"><path class="fxflap" d="M-15 0 Q-8 -10 0 0" stroke="${c||'#3A3A4A'}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path class="fxflap" d="M0 0 Q8 -10 15 0" stroke="${c||'#3A3A4A'}" stroke-width="3.2" fill="none" stroke-linecap="round"/></g>`,
  flock:(y, dur, begin, n, s, c, rtl)=>{ const b = Array.from({length:n||3},(_,k)=>`<g transform="translate(${-k*34} ${(k%2?-1:1)*k*9})" style="--fd:-${(k*.13).toFixed(2)}s;--fs:${(.3+(k%3)*.04).toFixed(2)}s">${FXA.bird((s||1)*(1-k*.08),c)}</g>`).join('');
    const p = rtl ? `M1150 ${y} Q512 ${y-50} -150 ${y+10}` : `M-150 ${y} Q512 ${y-50} 1150 ${y+10}`;
    return fxMove(p, dur, begin, rtl?`<g transform="scale(-1 1)">${b}</g>`:b); },
  soar:(cx, cy, rx, ry, dur, s, c)=>fxMove(`M${cx-rx} ${cy} A${rx} ${ry} 0 1 1 ${cx+rx} ${cy} A${rx} ${ry} 0 1 1 ${cx-rx} ${cy}`, dur, -fxRand(0,dur),
    `<g transform="scale(${s||1})"><path class="fxglide" d="M-34 4 Q-18 -10 0 0 Q18 -10 34 4 Q18 -2 0 6 Q-18 -2 -34 4 Z" fill="${c||'#2E2620'}"/><circle cx="0" cy="1" r="4" fill="${c||'#2E2620'}"/></g>`),

};
const FX_ALIAS = {pen:'pe', rtn:'rt', enn:'en', gsn:'gs', mmd:'mm', pmn:'pm', jfd:'jf', aon:'ao', cbn:'cb', kvn:'kv', I2day:'I2', I2sunrise:'I2', I2night:'I2'};
const FX_NIGHTISH = new Set(['aa','in','nn']);

/* ---- hidden butterflies: one per place ---- */
const BFLY = [
  {place:'London',    key:'P',  x:930, y:300, c:'#E5383B'},
  {place:'India',     key:'I3', x:880, y:415, c:'#FF7F11'},

  {place:'Mexico',    key:'mt', x:556, y:300, c:'#FF6B9A'},
  {place:'Peru',      key:'pm', x:960, y:560, c:'#9B5DE5'},
  {place:'Japan',     key:'jn', x:140, y:340, c:'#FF9EB5'},
  {place:'Alaska',    key:'at', x:150, y:395, c:'#58E6D9'},

function bflyGot(){ try{ return new Set(JSON.parse(localStorage.getItem('tlb_bfly')||'[]')); }catch(e){ return new Set(); } }
function bflySave(s){ try{ localStorage.setItem('tlb_bfly', JSON.stringify([...s])); }catch(e){} }
function bflySVG(c, w){ return `<svg viewBox="-24 -22 48 44" width="${w}" height="${w}">${FXA.bfly(c,1)}<path d="M-1 -6 Q-5 -16 -8 -18 M1 -6 Q5 -16 8 -18" stroke="#1D1D2B" stroke-width="1.6" fill="none"/></svg>`; }
function bflyPlace(screen, key){
  const b = BFLY.find(z=>z.key===key); if(!b) return; const got = bflyGot(); if(got.has(b.place)) return;
  const el = document.createElement('button'); el.className = 'hidbfly'; el.style.left = b.x+'px'; el.style.top = b.y+'px'; el.setAttribute('aria-label','A hidden butterfly');
  el.innerHTML = bflySVG(b.c, 46);
  el.onclick = e=>{ e.stopPropagation(); const g = bflyGot(); g.add(b.place); bflySave(g); el.classList.add('caught'); try{ sfx.chime(); }catch(_){}
    try{ if(typeof burst==='function') burst(e.clientX, e.clientY); }catch(_){}
    const t = document.createElement('div'); t.className = 'bflytoast'; t.innerHTML = `${bflySVG(b.c,44)}<div><b>You found a hidden butterfly!</b><span>${g.size} of 15 butterflies</span></div>`; screen.appendChild(t);
    setTimeout(()=>{ try{ if(typeof llMaybe==='function') llMaybe('lucas', 9); }catch(_){} }, 200);
    setTimeout(()=>t.classList.add('out'), 2600); setTimeout(()=>{ t.remove(); el.remove(); }, 3200);
    if(g.size===15) setTimeout(bflyAll, 3300); };
  screen.appendChild(el);
}
function bflyAll(){ const ov = document.createElement('div'); ov.className = 'bflyall'; ov.innerHTML = `<div class="bflycard"><h2>All 15 butterflies found!</h2><div class="bflygrid">${BFLY.map(b=>`<div>${bflySVG(b.c,52)}<span>${b.place}</span></div>`).join('')}</div><button class="big" id="bfok">Hooray!</button></div>`;
  document.getElementById('stage').appendChild(ov); try{ sfx.chime(); setTimeout(()=>sayLL('lisa', 8), 300); }catch(_){}
  ov.querySelector('#bfok').onclick = ()=>ov.remove(); }
function bflyBook(){ const g = bflyGot(); const ov = document.createElement('div'); ov.className = 'bflyall';
  ov.innerHTML = `<div class="bflycard"><h2>Hidden butterflies &middot; ${g.size} of 15</h2><p>One butterfly is hiding in every place. Look closely at the stops!</p><div class="bflygrid">${BFLY.map(b=>`<div class="${g.has(b.place)?'got':'no'}">${bflySVG(g.has(b.place)?b.c:'#C9C3B8',52)}<span>${b.place}</span></div>`).join('')}</div><button class="big" id="bfok">Close</button></div>`;
  document.getElementById('stage').appendChild(ov); ov.querySelector('#bfok').onclick = ()=>{ try{ sfx.pop(); }catch(_){} ov.remove(); }; }
function bflyChip(){ const n = bflyGot().size; return `<button class="bflychip" id="bfchip" aria-label="Hidden butterflies">${bflySVG('#FF7F11',26)}<span>${n}/15</span></button>`; }

/* ---- the layer builder ---- */
function fxKey(svg){ const gr = svg.querySelector('linearGradient[id^="sk"]'); if(!gr) return null; let k = gr.id.slice(2); k = FX_ALIAS[k] || k; return FX[k] ? {k, gr} : null; }
function fxLum(hex){ const m = /#([0-9a-f]{6})/i.exec(hex||''); if(!m) return 1; const v = parseInt(m[1],16); return (((v>>16)&255)*.3 + ((v>>8)&255)*.59 + (v&255)*.11)/255; }
function fxIsCloud(el){ return el.tagName==='g' && el.getAttribute('fill')==='#fff' && el.getAttribute('opacity')==='.9'; }
function fxIsStar(el){ return el.tagName==='circle' && el.getAttribute('fill')==='#fff' && +el.getAttribute('r') < 4.5; }
function fxIsSunMoon(el){ if(el.tagName!=='circle' || +el.getAttribute('r') < 30 || +el.getAttribute('cy') > 420) return false; const c = (el.getAttribute('fill')||'').toUpperCase(); if(c==='#F4F1E1') return true; const m = /^#([0-9A-F]{6})$/.exec(c); if(!m) return false; const v = parseInt(m[1],16); return ((v>>16)&255) > 220 && ((v>>8)&255) > 100 && (v&255) < 150; }
function fxSvg(cls, inner){ return `<svg data-fx="x" class="full fxl ${cls}" viewBox="0 0 1024 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${inner}</svg>`; }
const FX_MAPCLOUDS = ()=>[0,1,2].map(k=>`<g class="fxc" style="--t:${34+k*10}s;--dx:${90+k*30}px;animation-delay:-${k*9}s"><g transform="translate(${220+k*300} ${150+k*170}) scale(${1.3-k*.2})" fill="#fff" opacity=".45"><ellipse cx="0" cy="0" rx="50" ry="24"/><ellipse cx="38" cy="-12" rx="34" ry="26"/><ellipse cx="-36" cy="-6" rx="28" ry="20"/></g></g>`).join('');
function fxGeneric(svg, screen, isGame){
  // scenes with no sky: maps, the friends page, the world picker, plain game boards
  const r = svg.querySelector('rect'); const c = (r && r.getAttribute('fill')||'').toUpperCase(); const night = fxLum(c) < .3;
  let top = '';
  if(isGame) top = FXA.motes(8, 'rgba(255,255,240,.55)', 120, 600);
  else if(night) top = FXA.fireflies(10, 200, 640);
  else top = FX_MAPCLOUDS() + FXA.flock(110, 30, -5, 3, .8, '#4A5A6A');
  svg.insertAdjacentHTML('afterend', fxSvg('fxtop', top));
}
function fxApply(svg){
  svg.dataset.fx = '1';
  const screen = svg.closest('.screen'); if(!screen) return; const isGame = !!screen.querySelector('.mg-title');
  const kk = fxKey(svg) || (()=>{ const gr = svg.querySelector('linearGradient[id^="sk"]'); return gr ? {k:null, gr} : null; })();
  const bgForced = (typeof BG_OFF!=='undefined' && !BG_OFF) ? svg.getAttribute('data-bg') : null;
  if(!kk){ if(bgForced){ fxPaintedPlain(svg, screen, isGame, bgForced); return; } fxGeneric(svg, screen, isGame); return; }
  const {k, gr} = kk, rawKey = gr.id.slice(2);
  const night = fxLum(gr.querySelector('stop') && gr.querySelector('stop').getAttribute('stop-color')) < .3 || FX_NIGHTISH.has(k);
  const bgf = bgForced || ((typeof BG!=='undefined') && BG[rawKey] && !(isGame && /^[A-Z]/.test(rawKey)) && !(typeof BG_OFF!=='undefined' && BG_OFF) ? BG[rawKey] : null);
  if(bgf){ fxPainted(svg, screen, isGame, k, gr, rawKey, night, bgf); return; }
  const g = svg.querySelector('g[filter]') || svg; const kids = [...g.children]; const skyRect = g.querySelector(`rect[fill="url(#${gr.id})"]`);
  // the sky run: the sun, moon, clouds and stars drawn before the scenery
  const run = []; let i = kids.indexOf(skyRect) + 1;
  for(; i<kids.length; i++){ const el = kids[i]; if(fxIsCloud(el) || fxIsStar(el) || fxIsSunMoon(el) || (el.tagName==='circle' && el.getAttribute('fill')==='#E2DECB')) run.push(el); else break; }
  const covered = el=>{ try{ const b = el.getBBox(), cx = b.x + b.width/2, cy = b.y + b.height/2; let top = el; while(top.parentNode!==g) top = top.parentNode; const idx = kids.indexOf(top);
    for(let q = idx+1; q < kids.length; q++){ const o = kids[q]; if(o.tagName==='path' && o.getAttribute('fill')==='none') continue; const bb = o.getBBox(); if(bb.width*bb.height > 0 && bb.width < 1024 && cx > bb.x && cx < bb.x+bb.width && cy > bb.y && cy < bb.y+bb.height) return true; } }catch(e){ return true; } return false; };
  g.querySelectorAll('path[fill="none"][opacity=".55"]').forEach(el=>{ const d = el.getAttribute('d')||''; if(d.length < 60 && / q/.test(d) && !covered(el)) el.setAttribute('data-fxw','1'); });
  // front layer: a copy of the scene without its sky
  const front = svg.cloneNode(true); front.removeAttribute('data-fx'); front.dataset.fx = 'front'; front.classList.add('fxfront');
  const fg = front.querySelector('g[filter]') || front; const fkids = [...fg.children];
  const fsky = fg.querySelector(`rect[fill="url(#${gr.id})"]`); if(fsky) fsky.remove();
  run.forEach(el=>{ const j = kids.indexOf(el); if(fkids[j]) fkids[j].remove(); });
  // back layer keeps only sky + sun/moon
  kids.forEach(el=>{ if(el===skyRect || el.tagName==='defs' || el.tagName==='linearGradient' || el.tagName==='radialGradient' || fxIsSunMoon(el) || (run.includes(el) && el.getAttribute('fill')==='#E2DECB')) return; if(run.includes(el) || el!==skyRect) el.remove(); });
  // the sky animation layer
  let sky = '';
  const suns = run.filter(el=>fxIsSunMoon(el));
  if(!isGame) suns.forEach(el=>{ const x = +el.getAttribute('cx'), y = +el.getAttribute('cy'), r = +el.getAttribute('r'), moon = el.getAttribute('fill')==='#F4F1E1';
    sky += moon ? FXA.glow(x,y,r*1.8,'rgba(255,255,230,.18)',5)
      : `<g transform="translate(${x} ${y})"><g class="fxspin" style="--t:50s">${Array.from({length:12},(_,j)=>`<path d="M-6 ${-r-12} L0 ${-r-34} L6 ${-r-12} Z" fill="${el.getAttribute('fill')}" opacity=".55" transform="rotate(${j*30})"/>`).join('')}</g></g>${FXA.glow(x,y,r*(r>55?1.5:1.8),'rgba(255,236,150,.3)',4)}`; });
  run.filter(fxIsCloud).forEach((el,j)=>{ sky += `<g class="fxc" style="--t:${(26+j*9)}s;--dx:${30+j*12}px;animation-delay:-${j*7}s">${el.outerHTML}</g>`; });
  const stars = run.filter(fxIsStar);
  stars.forEach((el,j)=>{ sky += `<g class="fxtw" style="--t:${(2+(j%5)*.6).toFixed(1)}s;animation-delay:-${(j*.37%3).toFixed(2)}s">${el.outerHTML}</g>`; });
  if(night && stars.length) sky += `<g class="fxshoot"><path d="M900 60 l60 -26" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>`;
  // the top layer: lifted waves and boats, the scene's own animation and a soft frame
  let top = '';
  [...fg.querySelectorAll('path[data-fxw]')].forEach((el,j)=>{ { top += `<g class="fxwv" style="--t:${(2.6+(j%4)*.5).toFixed(1)}s;animation-delay:-${(j*.7).toFixed(1)}s">${el.outerHTML}</g>`; el.remove(); } });
  [...fg.querySelectorAll('g[transform]')].forEach(el=>{ const p = el.firstElementChild; if(p && p.tagName==='path' && /^M-60 0 L60 0 L44 24/.test(p.getAttribute('d')||'')){ top += `<g transform="${el.getAttribute('transform')}"><g class="fxbob" style="--t:${(3+FXR()*1.5).toFixed(1)}s">${el.innerHTML}</g></g>`; el.remove(); } });
  [...fg.querySelectorAll('g[transform]')].forEach(el=>{ const p = el.firstElementChild; if(p && p.tagName==='path' && p.getAttribute('stroke')==='#8B6237' && /^M0 0 Q-8 -60/.test(p.getAttribute('d')||'')){ top += `<g transform="${el.getAttribute('transform')}"><g class="fxsway" style="--t:${(3.5+FXR()*1.5).toFixed(1)}s">${el.innerHTML}</g></g>`; el.remove(); } });
  const hasSkyLife = run.some(el=>fxIsCloud(el) || fxIsStar(el));
  if(isGame){ if(!hasSkyLife && !top) top += FXA.motes(8, 'rgba(255,255,240,.55)', 120, 600); }
  else if(k){ top += FX[k](night); if(!night && !['ar','mn','cc','aa'].includes(k) && !/flock|soar/.test(FX[k].toString())) top += FXA.flock(130, 28, -6, 3, .8); }
  else top += night ? FXA.fireflies(10, 300, 640) : FXA.flock(130, 28, -6, 3, .8);

/* ---- v21: animated actors driven frame by frame (proper walk and hop cycles) ---- */
const ACT = {};
const actSm = x=>x<0?0:x>1?1:x*x*(3-2*x);
const actLerp = (a,b,t)=>a+(b-a)*t;
function actor(name, p){ return `<g data-act="${name}" data-p='${JSON.stringify(p||{})}'>${ACT[name].svg(p||{})}</g>`; }
const T_ = (el, s)=>{ if(el) el.setAttribute('transform', s); };

/* Kangaroo: hops in, stops to look around, turns and hops away */
ACT.kangaroo = {
  svg:p=>{ const c = p.c||'#B87A4B', d = p.d||'#9C6438', l = p.l||'#E8C49E'; return `<g class="a-root"><ellipse class="a-shadow" cx="0" cy="3" rx="34" ry="6" fill="rgba(0,0,0,.18)"/><g class="a-body">
    <g class="a-tail"><path d="M-20 -40 Q-58 -32 -94 0 Q-90 6 -82 4 Q-52 -16 -16 -26 Z" fill="${d}"/></g>
    <g class="a-legb"><ellipse cx="-2" cy="-22" rx="13" ry="17" fill="${d}"/><path d="M-6 -8 L26 -2 Q30 1 26 4 L-8 4 Z" fill="${d}"/></g>
    <path d="M-30 -32 Q-36 -82 4 -100 Q28 -104 26 -80 Q22 -50 12 -26 Q-6 -8 -30 -32 Z" fill="${c}"/>
    <path d="M2 -88 Q18 -84 14 -56 Q8 -36 -6 -30 Q4 -60 2 -88 Z" fill="${l}"/>
    <g class="a-leg"><ellipse cx="-4" cy="-22" rx="16" ry="20" fill="${c}"/><path d="M-8 -6 L30 -1 Q35 2 30 5 L-10 5 Z" fill="${c}"/></g>
    <g class="a-arm"><path d="M12 -74 Q26 -64 22 -52" stroke="${d}" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g class="a-head"><path d="M16 -122 L10 -148 L26 -124 Z" fill="${d}"/><path d="M6 -104 Q12 -124 30 -122 Q46 -118 56 -108 Q50 -98 34 -98 Q14 -96 6 -104 Z" fill="${c}"/>
      <g class="a-ear"><path d="M22 -120 L20 -150 L32 -122 Z" fill="${c}"/><path d="M24 -124 L23 -142 L29 -124 Z" fill="${l}"/></g>
      <circle cx="36" cy="-112" r="3" fill="#1D1D2B"/><circle cx="37" cy="-113" r="1" fill="#fff"/><circle cx="56" cy="-107" r="3" fill="#3A2416"/></g>
  </g></g>`; },
  init:(el,p)=>{ const s = p.s||.6, P = .62; return {s, P, x0:p.x0, x1:p.x1, y:p.y, L:p.L||70, H:p.H||46, wait:p.wait||3, off:p.off||2.5,
    q:{root:el.querySelector('.a-root'), body:el.querySelector('.a-body'), leg:el.querySelector('.a-leg'), legb:el.querySelector('.a-legb'), tail:el.querySelector('.a-tail'), head:el.querySelector('.a-head'), ear:el.querySelector('.a-ear'), arm:el.querySelector('.a-arm'), sh:el.querySelector('.a-shadow')}}; },
  update:(st,t)=>{ const {P, L, H} = st, dist = Math.abs(st.x1-st.x0), nh = Math.max(1, Math.round(dist/(L*st.s))), hopT = nh*P;
    const cyc = hopT*2 + st.wait + st.off, tc = t % cyc; let x, dir, u = -1, idle = 0;
    const dirIn = st.x1 < st.x0 ? -1 : 1;
    if(tc < hopT){ const k = tc/P, i = Math.floor(k); u = k-i; const air = u<.22?0:actSm((u-.22)/.78); x = st.x0 + dirIn*(i+air)*dist/nh; dir = dirIn; }
    else if(tc < hopT+st.wait){ x = st.x1; dir = dirIn; idle = tc-hopT; }
    else if(tc < hopT*2+st.wait){ const k = (tc-hopT-st.wait)/P, i = Math.floor(k); u = k-i; const air = u<.22?0:actSm((u-.22)/.78); x = st.x1 - dirIn*(i+air)*dist/nh; dir = -dirIn; }
    else { x = st.x0; dir = -dirIn; u = -2; }

    if(u >= 0){ if(u < .22){ const s = Math.sin(Math.PI*u/.22); by = 5*s; pitch = 10*s; leg = -6*s; sq = 1-.06*s; }
      else { const v = (u-.22)/.78; by = -H*Math.sin(Math.PI*v); pitch = 16*Math.sin(Math.PI*v); leg = actLerp(38,-22,actSm(v*1.15)); tail = 22*Math.sin(Math.PI*v); arm = 12*Math.sin(Math.PI*v); } }
    else if(u === -1){ by = Math.sin(idle*3)*1.2; head = idle>.6&&idle<1.6 ? -12*Math.sin((idle-.6)*Math.PI) : idle>1.9&&idle<2.6 ? 8*Math.sin((idle-1.9)*Math.PI/.7) : 0; ear = (idle%1.3)<.12 ? -18 : 0; tail = 2*Math.sin(idle*2); }
    const q = st.q, vis = u===-2 ? 0 : 1;
    T_(q.root, `translate(${x.toFixed(1)} ${st.y}) scale(${(dir*st.s).toFixed(3)} ${st.s})`); q.root.style.opacity = vis;
    T_(q.body, `translate(0 ${by.toFixed(1)}) rotate(${pitch.toFixed(1)} -6 -36) scale(1 ${sq.toFixed(3)})`);
    T_(q.leg, `rotate(${leg.toFixed(1)} -6 -36)`); T_(q.legb, `rotate(${(leg*.85).toFixed(1)} -6 -36)`);
    T_(q.tail, `rotate(${tail.toFixed(1)} -20 -36)`); T_(q.head, `rotate(${head.toFixed(1)} 14 -104)`); T_(q.ear, `rotate(${ear} 24 -122)`); T_(q.arm, `rotate(${arm.toFixed(1)} 12 -74)`);
    if(q.sh){ const k = 1 + by/120; q.sh.setAttribute('transform', `translate(0 ${-by.toFixed(1)}) scale(${k.toFixed(3)} 1)`); q.sh.setAttribute('opacity', (.5+ .5*k).toFixed(2)); } }
};

  update:(st,t)=>{ const dist = Math.abs(st.x1-st.x0), dir = st.x1<st.x0?-1:1, T = dist/st.sp + 2; const tc = (t + st.ph) % T, x = st.x0 + dir*Math.min(dist, tc*st.sp);

    [0, Math.PI, Math.PI*.5, Math.PI*1.5].forEach((o,i)=>{ const a = Math.sin(w+o)*16; const hx = [-26,22,-18,30][i]; T_(q.l[i], `rotate(${a.toFixed(1)} ${hx} -46)`); }); }
};

/* Duck: paddles around the pond, always facing the way it swims */
ACT.duck = {
  svg:p=>`<g class="a-root"><g class="a-body"><ellipse cx="0" cy="0" rx="16" ry="8" fill="${p.c||'#8B5A33'}"/><path d="M-16 -2 L-24 -8 L-18 2 Z" fill="${p.c||'#8B5A33'}"/><path d="M-6 -4 Q2 -10 10 -4" stroke="#6B4423" stroke-width="2" fill="none"/>

  update:(st,t)=>{ const a = (t+st.ph)/st.T*Math.PI*2, x = st.cx + Math.cos(a)*st.rx, y = st.cy + Math.sin(a)*st.ry, vx = -Math.sin(a); const dir = vx>=0?1:-1;

/* follows a path (replaces SVG animateMotion, which can freeze) */

  init:(el,p)=>{ const path = el.querySelector('.a-path'), len = path.getTotalLength(), N = 160, pts = [];

  update:(st,t)=>{ const p = st.p; let u = (((t - p.begin) % p.dur) + p.dur) % p.dur / p.dur;
    if(p.kt){ let i = 0; while(i < p.kt.length-2 && u > p.kt[i+1]) i++; const f = (u - p.kt[i])/((p.kt[i+1]-p.kt[i])||1); u = p.kp[i] + (p.kp[i+1]-p.kp[i])*Math.max(0,Math.min(1,f)); }
    const k = Math.min(st.N-1, Math.floor(u*st.N)), f = u*st.N - k, A = st.pts[k], B = st.pts[k+1];
    let s = `translate(${(A[0]+(B[0]-A[0])*f).toFixed(1)} ${(A[1]+(B[1]-A[1])*f).toFixed(1)})`;
    if(p.rot) s += ` rotate(${(Math.atan2(B[1]-A[1], B[0]-A[0])*180/Math.PI).toFixed(1)})`;

      const doc = new DOMParser().parseFromString(svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '), 'image/svg+xml');
      const root = doc.documentElement; if(root.tagName!=='svg') return svg;
      /* 1. eyes: everything small centred inside each eye circle */
      const eyes = (L.eyes||[]).map(([x,y,r])=>{
        const mem = [...root.children].filter(el=>{ const c = clCentre(el); if(!c) return false;
          const rr = +(el.getAttribute('r') || el.getAttribute('rx') || el.getAttribute('width') || 99);
          return Math.hypot(c[0]-x, c[1]-y) <= r && rr <= r + 1; });
        return clGroup(root, mem, 'cl-eye' + (L.slow ? ' slow' : ''), `transform-origin:${x}px ${y}px`);
      });
      /* 2. signature parts */
      (L.parts||[]).forEach(p=>{
        const used = new Set(), mem = [];
        p.m.forEach(sig=>{
          if(sig.startsWith('eye')){ mem.push(eyes[+sig.slice(3)]); return; }
          const el = [...root.children].find(e=>!used.has(e) && !e.classList.contains('cl-eye') && clSig(e)===sig);
          if(el){ used.add(el); mem.push(el); }
        });
        let st = `transform-origin:${p.o[0]}px ${p.o[1]}px;--t:${p.t||2}s`;
        if(p.a) st += `;--a:${p.a}deg`; if(p.s) st += `;--s:${p.s}`; if(p.y) st += `;--y:${p.y}px`;
        clGroup(root, mem, p.cls + (p.flap ? ' flap' : ''), st);
      });
      /* 3. breathing body: everything in one group, anchored at the feet */
      const all = clGroup(root, [...root.children], 'cl-b', '');
      if(kind==='sloth' && all) all.setAttribute('class', 'cl-b slow');
      tpl = CL_CACHE[key] = new XMLSerializer().serializeToString(root).replace(/ xmlns="http:\/\/www\.w3\.org\/2000\/svg"/, '');
    }catch(e){ return svg; }
  }
  /* random phase per drawing so animals never move in lockstep */
  const d = -(Math.random()*6).toFixed(2), bt = (3.4 + Math.random()*2.4).toFixed(2);
  return tpl.replace('<svg ', `<svg class="cul-live" style="--d:${d}s;--bt:${bt}s" `);
}

/* ---------- sliding picture: made by sliding the solved picture backwards with real moves, so it can always be solved ---------- */

    if(!slideFrom(k)){ miss(); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); sfx.oops(); return; }
    hist.push(before); poke(); moves++; document.getElementById('cnt').textContent = `Moves: ${moves}`; tone(600+Math.random()*200,.07,'triangle',.12); place();
    if(p.every((v,k)=>v===k)){ clearHint(); G.getT = null; box.classList.add('solved'); setTimeout(()=>cityDone('rz', 0), 900); } });

const V3 = {"aoife": {"f": "friends/vo/aoife.mp3", "o": [[0.2, 5.123], [6.123, 2.74], [9.663, 9.612], [20.075, 4.683], [25.558, 4.192], [30.55, 3.72], [35.07, 5.159], [41.029, 5.351], [47.18, 4.72], [52.7, 3.701], [57.201, 4.359], [62.36, 6.52], [69.68, 4.92], [75.4, 3.08], [79.28, 3.96], [84.04, 3.96], [88.8, 6.32]], "t": ["Dia duit! That's hello in Irish. I'm Aoife, your cousin!", "I'm a seven-spot ladybird. Count my spots! One... seven!", "Welcome to Ireland, the Emerald Isle! So green!", "After the rain, look for a rainbow! There's one!", "In Dublin, music plays on every corner!", "The harp is a symbol of Ireland!", "This is a real castle, hundreds of years old!", "People say if you kiss the Blarney Stone, you'll always have things to say!", "The Cliffs of Moher are so high! Whoosh!", "Puffins have bright orange beaks!", "Baa! Sheep wool makes cozy sweaters, like my scarf.", "A story says a giant named Finn built a stone road across the sea!", "Irish dancers tap their feet super fast. Tap, tap!", "Brilliant! You found it!", "Ah, not to worry. Have another go there!", "Grand job, cousin! Grand job!", "Go raibh maith agat, Traveling Ladybugs! That means thank you. Slán! Bye bye!"]}, "colette": {"f": "friends/vo/colette.mp3", "o": [[0.2, 6.58], [7.58, 5.55], [13.93, 5.27], [20.0, 7.382], [28.182, 5.36], [34.342, 3.752], [38.894, 4.749], [44.443, 5.157], [50.4, 2.844], [54.044, 5.976], [60.82, 5.712], [67.332, 5.739], [73.871, 6.146], [80.817, 3.52], [85.137, 3.883], [89.82, 3.275], [93.895, 5.145], [99.84, 6.799]], "t": ["Bonjour, mes amis! That means hello, my friends! I am Colette, and welcome to Paris!", "I am a honeybee. I live on the roof of the Paris Opera house!", "At night I watch the ballet dancers twirl. Tra-la-la!", "Paris is the city of art, and music, and yummy bread. Oh, I love it so!", "Voilà! The Eiffel Tower, built more than one hundred years ago!", "It's made of iron and painted by hand!", "On hot days, the Eiffel Tower grows a tiny bit taller!", "This is the Louvre, a giant art museum with a glass pyramid.", "Can you smile like the Mona Lisa? Ooh, très bien!", "We float down the river Seine. Wave to the bridges!", "This is the Arc de Triomphe. Beep beep, so many cars!", "Parisians love crunchy baguettes and flaky croissants. Miam miam!", "Artists paint in the streets here. Some of them paint me! I am a very good model.", "C'est magnifique! You found it!", "Oh là là, not quite! Try again, mon amie!", "Bravo! Bravo! Encore!", "Hmm. A true detective must look with her eyes and her heart.", "Merci, Traveling Ladybugs. Thank you! Come back to Paris and dance with me. Au revoir!"]}, "jabari": {"f": "friends/vo/jabari.mp3", "o": [[0.2, 6.331], [7.331, 5.759], [13.89, 5.35], [20.04, 6.26], [27.1, 4.44], [32.34, 4.73], [37.87, 5.33], [44.0, 4.46], [49.26, 6.436], [56.496, 3.324], [60.62, 5.05], [66.47, 3.549], [70.819, 4.021], [75.64, 4.01], [80.45, 3.081], [84.331, 6.209]], "t": ["Jambo! That means hello in Swahili. I'm Jabari, and welcome to Kenya!", "I'm a termite builder. See my hard hat? We build giant mounds!", "Tunnels keep our mounds cool. Me and a million friends planned it!", "Here's the plan: Nairobi, the Maasai Mara, the migration, a Maasai village!", "In Nairobi, you can see giraffes near tall buildings!", "The Maasai Mara is a huge savanna. Binoculars ready!", "Lions, zebras, giraffes! A mama elephant and her baby!", "Here comes the Great Migration, a million wildebeest!", "Watch! They're crossing the river. Splash, splash, splash! Run, wildebeest, run!", "Maasai people wear bright red cloth and beaded jewelry.", "The Maasai jumping dance goes high, high! Can you jump?", "At night, the sky is full of stars!", "Hongera! You found it! That means congratulations!", "Not that one. Check the plan and try again!", "Hooray! Job well done, builder!", "Asante, Traveling Ladybugs! Kwaheri! That means goodbye. Come back to Kenya soon!"]}, "kenta": {"f": "friends/vo/kenta.mp3", "o": [[0.2, 5.899], [6.899, 5.902], [13.601, 4.666], [19.067, 3.949], [23.816, 5.104], [29.72, 4.408], [34.928, 4.642], [40.37, 6.201], [47.371, 3.689], [51.86, 4.26], [56.92, 4.69], [62.41, 4.31], [67.52, 5.751], [74.071, 5.095], [79.966, 3.946], [84.711, 5.964], [91.475, 3.293], [95.568, 5.589]], "t": ["Konnichiwa! That means hello! I am Kenta, and welcome to Japan!", "I'm a rhinoceros beetle. See my big horn? I'm super strong!", "In summer, kids in Japan go looking for beetles like me!", "Yosh! Let's go! I love a challenge!", "First, Tokyo! A giant city of bright lights!", "Whoosh! The bullet train zooms super fast!", "In Kyoto, thousands of orange gates go up the mountain!", "Let's count the gates! One, two, three... too many!", "In Nara, some deer bow! Bow to them!", "The deer love crackers. Munch, munch!", "That's Mount Fuji, wearing a big white snow hat.", "Origami is paper folding. You can fold a crane!", "A story says if you fold one thousand cranes, you can make a wish!", "Sushi, and noodles you slurp. Slurping is okay here!", "Sugoi! Amazing! You found it!", "Don't give up! Try again. Ganbatte! That means do your best!", "Yosh! We did it! High five!", "Arigatou, Traveling Ladybugs! Thank you! Mata ne, see you later!"]}, "lisa": {"f": "ll/lisa.mp3", "o": [[0.2, 3.03], [4.03, 3.89], [8.72, 4.15], [13.67, 3.88], [18.35, 3.17], [22.32, 4.219], [27.339, 3.177], [31.316, 2.919], [35.035, 3.065], [38.9, 1.851], [41.551, 6.589], [48.94, 7.37], [57.11, 7.1], [65.01, 7.7], [73.51, 6.62], [80.93, 6.08], [87.81, 7.34], [95.95, 7.87], [104.62, 6.67], [112.09, 5.97], [118.86, 7.374], [127.034, 6.646], [134.48, 6.85], [142.13, 7.419]], "t": ["Ooh, a new case! Let's go!", "Look! A clue! Tap the sparkly circle.", "I see something! Let's look closer.", "Ready for a challenge? You can do it!", "You found it! Great job!", "Oops! That's okay. Try again!", "Hmm. Where could it be?", "Hooray! We did it!", "Tap the glowing stop on the map!", "Hee hee hee!", "Oh no! Priya's toy elephant, Raja, is missing! It was a gift from her grandma.", "Oh no! Colette's music box is missing! It plays the song she dances to every night.", "Oh no! Lucia's lucky gold coin is gone! She was saving it for the Trevi Fountain.", "Oh no! Sami's golden scarab charm is missing! It was a gift from his great-great-grandpa.", "Oh no! Nikos has a big singing contest today, and his olive crown is missing!", "Oh no! Paco's party is tonight, and the star piñata is missing!", "Oh no! Mateo's rainbow yarn is missing! His grandma gave it to him to make a new hat.", "Oh no! Kenta folded nine hundred and ninety-nine paper cranes, but his golden one is missing!", "Oh no! Skye's snow globe is missing! It has a tiny Alaska inside.", "Oh no! Matilda's sun hat is missing, and it's a hot, sunny day!", "Oh no! Luna's little silver bell is missing! She rings it to call her forest friends.", "Oh no! Our cousin Aoife's golden harp is missing! She plays it for the Irish dancers.", "Oh no! Ruby's map is missing! She needs it to fly all the way to Mexico.", "Oh no! Jabari's building plan is missing! It shows how to build the coolest termite mound ever."]}, "lucas": {"f": "ll/lucas.mp3", "o": [[0.2, 4.1], [5.1, 3.55], [9.45, 4.137], [14.387, 4.012], [19.199, 2.401], [22.4, 2.92], [26.12, 4.28], [31.2, 1.773], [33.773, 2.896], [37.469, 3.559], [41.828, 6.802], [49.43, 6.97], [57.2, 6.46], [64.46, 7.198], [72.458, 5.732], [78.99, 5.82], [85.61, 5.4], [91.81, 6.82], [99.43, 6.8], [107.03, 5.33], [113.16, 7.303], [121.263, 5.047], [127.11, 5.75], [133.66, 6.73]], "t": ["Don't worry. The Traveling Ladybugs are on the case!", "Let me write that in my notebook.", "Let's check the map. Which way next?", "Another passport stamp! Woo-hoo!", "Nice one, detective!", "Almost! Look again.", "All the clues are found! Let's solve the case!", "Ha ha ha!", "Whoa! Look at that!", "Pack your bags! Where shall we go next?", "Case closed! Chiku the monkey borrowed Raja, because the mirrors were so sparkly!", "Case closed! Pierre the pigeon took the music box. He wanted to dance like the ballerinas!", "Case closed! Bella the cat took the lucky coin, because it was so shiny!", "Case closed! Zara the desert fox thought the scarab was a tiny sun to keep her warm!", "Case closed! Gus the goat took the olive crown. He thought it was a snack!", "Case closed! Iggy the iguana took the piñata to nap in its shade!", "Case closed! Lulu the baby llama was playing with the yarn ball!", "Case closed! Shika the deer picked up the golden crane, because deer love paper!", "Case closed! Ollie the sea otter took the snow globe. Otters love shiny things!", "Case closed! Joey was keeping the sun hat in his mum's pouch!", "Case closed! Slowpoke the sloth took the bell... very, very slowly!", "Case closed! Seamus the sheep just wanted to make music too!", "Case closed! Nutty the squirrel used the map to make a cozy nest!", "Case closed! Tembo the baby elephant was using the plan to fan her big ears!"]}, "lucia": {"f": "friends/vo/lucia.mp3", "o": [[0.2, 8.845], [9.845, 4.96], [15.605, 4.146], [20.551, 4.662], [26.013, 4.331], [31.144, 4.856], [36.8, 3.525], [41.125, 3.403], [45.328, 4.886], [51.014, 4.524], [56.338, 2.593], [59.731, 3.47], [64.001, 5.66], [70.461, 5.754], [77.015, 2.503], [80.318, 6.166], [87.284, 2.198], [90.282, 4.847]], "t": ["Ciao! Ciao! In Italy, ciao means hi and bye, both! I'm Lucia, and welcome to Rome!", "I'm a firefly. When I'm excited, my tail lights up!", "Blink, blink! That means I'm so happy you're here!", "Rome is super old. People call it the Eternal City!", "A legend says the brothers Romulus and Remus founded Rome.", "This is the Colosseum, where crowds watched big shows long ago!", "The Roman Forum was the busy heart of old Rome.", "The Pantheon has a big round hole in its roof!", "When it rains, the rain falls inside, and tiny holes drain it away!", "They say if you toss a coin in the Trevi Fountain, you'll come back one day!", "The coins go to help people who need it.", "Let's get gelato! Strawberry, chocolate and lemon!", "And pizza! And pasta! Twirl, twirl, twirl the spaghetti on your fork!", "At night, when Rome gets quiet, I light up the gardens. Blink, blink, blink!", "Bravissimo! You found it!", "Oops! Try again, my friend. Piano, piano. That means slowly, slowly.", "Evviva! Hooray!", "Grazie, Traveling Ladybugs! Thank you! Ciao, ciao, see you soon!"]}, "luna": {"f": "friends/vo/luna.mp3", "o": [[0.2, 4.326], [5.326, 6.732], [12.858, 3.502], [17.16, 4.49], [22.45, 4.355], [27.605, 7.235], [35.64, 5.51], [41.95, 3.97], [46.72, 4.649], [52.169, 4.635], [57.604, 4.516], [62.92, 4.919], [68.639, 2.921], [72.36, 2.52], [75.68, 3.733], [80.213, 2.027], [83.04, 5.749]], "t": ["Pura vida, friends! It means pure life. I'm Luna.", "I'm a blue morpho. Closed, I'm brown. Open... flash! Blue!", "Tiny scales on my wings catch the light and shine.", "Costa Rica is small, but full of plants and animals!", "In the cloud forest, the trees reach the clouds!", "Shh. Listen. Tiny frogs, singing birds, and the drip, drip, drip of the rain.", "Look up! A sloth. Hello... Mister... Sloth.", "That's the Arenal Volcano, sleeping quietly.", "Warm water bubbles up near the volcano. So cozy.", "Hold on! A zip line over the treetops! Wheeeee!", "ROAR! A howler monkey, one of the loudest animals!", "And there's a toucan, with a giant rainbow beak. Hello, toucan!", "Baby sea turtles hurry to the ocean!", "You found it. How lovely.", "That's okay. Take a breath, and try again.", "Yay. Pura vida!", "Gracias, Traveling Ladybugs. Fly gently, and come back soon. Pura vida."]}, "mateo": {"f": "friends/vo/mateo.mp3", "o": [[0.2, 8.316], [9.316, 5.955], [16.071, 4.525], [21.396, 4.055], [26.251, 3.739], [30.79, 5.056], [36.646, 5.091], [42.537, 4.668], [48.005, 4.895], [53.7, 6.95], [61.45, 4.79], [67.04, 4.89], [72.73, 3.83], [77.36, 3.45], [81.61, 4.64], [87.05, 3.79], [91.64, 6.13]], "t": ["Hola, friends. That means hello. I'm Mateo. Let me bow to say hello. There. Welcome to Peru.", "I'm a praying mantis. A good detective is calm and careful.", "A mantis can look over its shoulder. I see you!", "Peru has tall mountains called the Andes.", "The Inca people were amazing builders and farmers.", "In Cusco, the stones fit like a puzzle, with no glue!", "In the Sacred Valley, the Inca built giant steps to grow food.", "Potatoes first came from here. Purple, yellow, red!", "And now... Machu Picchu, a stone city in the clouds.", "Take a deep breath, and look around. Isn't it peaceful? The mountains are like a giant hug.", "Here come the llamas and alpacas! So soft and fluffy.", "People dye wool bright colors with plants, and even a tiny bug!", "Just like my rainbow hat. A grandma made it for me.", "Well done. You found it. Very good.", "Slowly, slowly. Look again, and take your time.", "Wonderful. You are a very patient detective.", "Gracias, Traveling Ladybugs. Thank you. Let me bow goodbye. Adiós, my friends."]}, "matilda": {"f": "friends/vo/matilda.mp3", "o": [[0.2, 6.326], [7.326, 5.217], [13.343, 4.381], [18.524, 6.596], [25.92, 5.36], [32.08, 4.08], [36.96, 5.74], [43.5, 4.87], [49.17, 4.91], [54.88, 6.213], [61.893, 4.402], [67.095, 4.075], [71.97, 3.82], [76.59, 3.13], [80.52, 4.88], [86.2, 5.28]], "t": ["G'day, mates! That means hello! I'm Matilda, and welcome to Australia!", "I'm a Christmas beetle. Here, Christmas is in summer!", "Lots of families go to the beach on Christmas Day!", "My shell is shiny gold and green. Slip, slop, slap! Stay sun safe!", "That's the Sydney Opera House. Its roof looks like sails!", "The Harbour Bridge is called the Coathanger. Whoa!", "The Great Barrier Reef is the biggest coral reef in the world!", "Teeny tiny sea animals build the coral.", "Goggles on! Clownfish and sea turtles. Blub, blub!", "Hop, hop! A kangaroo, with a baby joey in her pouch!", "Shh! Koalas sleep most of the day.", "A platypus has a duck bill and lays eggs!", "Good on ya! You found it!", "No worries! Have another go!", "You little beauty! Tha const RZ_SPOTI = ['🌸','🐦','🎈','⭐','🍎','🦋','🐞','🌻','🎁','🐱','🌙','☁️','🍄','🐟','🪁','🍦','🚲','🎩','🐌','🍓'];

  let extra = N, idx = cshuf([...Array(N).keys()]);

    else { const i = idx.pop(); diffs.push(kd==='swap' ? {kind:'swap', i, a:pool[pool.length-1-diffs.length]} : {kind:'gone', i}); } });

/* ===== rzfun2.js (v23.16): five more Challenge Mode puzzle types + a little more motion

   - shadow:  "Shadow match" tap a picture, then its shadow. cat slide
   - feed:    "Snack count" give the animal the right number of treats. cat num

  return {type:'song', title:`Play the song: ${S.n}!`, song:k, s, sig:k+':'+s.length}; };
function rzSongPlay(g){
  const e = easy();
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">0 / ${g.s.length}</div>
    <div class="rztune rzsong"><div class="rzsheet" id="rzsh">${g.s.map((n,j)=>`<span class="rznote" data-j="${j}" style="--kc:${RZ_KC[n]}"></span>`).join('')}</div>

    armHint(()=>document.querySelector(`.rzpot[data-c="${want[2][pick.length ? (pick[0]===want[2][0] ? 1 : 0) : 0]}"]`)); }
  document.querySelectorAll('.rzpot').forEach(b=>b.onclick=()=>{ if(!G.live || pick.length>=2) return; poke(); const c = b.dataset.c; pick.push(c); tone(pick.length===1 ? 440 : 550,.12,'triangle',.14);
    b.classList.remove('dip'); void b.offsetWidth; b.classList.add('dip');

/* ===== rzfun4.js (v23.17): four more Challenge Mode puzzle types
   - pipes:    "Fix the stream" turn the pipe pieces so the water reaches the flower (cat maze)
   - suitcase: "Pack the suitcase" pack the things you need for the trip (snowy / beach / rainy) (cat detect)
   - hop:      "Ladybug hop" hop along the number line (Easy: to a number; Challenge: start + hops = ?) (cat num)
   - color:    "Colour the ladybug" (Easy: any colours; Challenge: copy the example) (cat play)
   Nothing is lost on a wrong tap. ===== */
/* ---------- Fix the stream ---------- */
const RZ_ROT = (m, r)=>{ for(let k=0;k<r;k++) m = ((m<<1) | (m>>3)) & 15; return m; }; // N1 E2 S4 W8, clockwise
RZ_MAKE.pipes = function(){ const e = easy(), R = e ? 3 : 4, C = e ? 3 : 5; let path = null;
  for(let t=0; t<300 && !path; t++){ const st = Math.floor(Math.random()*R), seen = new Set([st+',0']), p = [[st,0]];
    const walk = ()=>{ const [r,c] = p[p.length-1]; if(c===C-1 && p.length >= C + (e ? 0 : 2)) return true;
      for(const [a,b2] of cshuf([[r-1,c],[r+1,c],[r,c+1],[r,c+1]])){ const key = a+','+b2; if(a<0||a>=R||b2<0||b2>=C||seen.has(key)) continue; seen.add(key); p.push([a,b2]); if(walk()) return true; p.pop(); }
      return false; };
    if(walk()) path = p.slice(); }
  const dir = (a,b)=> b[0]<a[0] ? 1 : b[1]>a[1] ? 2 : b[0]>a[0] ? 4 : 8, opp = d=>({1:4,2:8,4:1,8:2})[d];
  const cells = Array.from({length:R*C},()=>rzOne([5,10,3,6,12,9]));
  path.forEach((p,k)=>{ const inn = k===0 ? 8 : opp(dir(path[k-1], p)), out = k===path.length-1 ? 2 : dir(p, path[k+1]); cells[p[0]*C+p[1]] = inn|out; });
  const keys = path.map(p=>p[0]*C+p[1]); let rot;
  do{ rot = cells.map(()=>Math.floor(Math.random()*4)); }while(rzPipesSolved({R,C,cells,s:path[0][0],e:path[path.length-1][0]}, rot));
  return {type:'pipes', title:'Turn the pipes so the water reaches the flower!', R, C, cells, rot, keys, s:path[0][0], e:path[path.length-1][0], sig:cells.join('')+rot.join('')}; };
function rzPipesSolved(g, rot){ const {R, C} = g, m = k=>RZ_ROT(g.cells[k], rot[k]); if(!(m(g.s*C) & 8)) return false;
  const seen = new Set([g.s*C]), q = [g.s*C];
  while(q.length){ const k = q.shift(), r = Math.floor(k/C), c = k%C, mk = m(k); if(r===g.e && c===C-1 && (mk & 2)) return true;
    [[1,-C,4],[2,1,8],[4,C,1],[8,-1,2]].forEach(([d,dk,back])=>{ const n = k+dk; if(!(mk & d)) return; if(d===2 && c===C-1) return; if(d===8 && c===0) return; if(n<0||n>=R*C||seen.has(n)) return; if(RZ_ROT(g.cells[n], rot[n]) & back){ seen.add(n); q.push(n); } }); }
  return false; }
function rzPipeSVG(m){ const seg = {1:'M50 50 V0', 2:'M50 50 H100', 4:'M50 50 V100', 8:'M50 50 H0'}; const d = [1,2,4,8].filter(b=>m&b).map(b=>seg[b]).join(' ');
  return `<svg viewBox="0 0 100 100"><path d="${d}" stroke="#8D6A2E" stroke-width="34" stroke-linecap="round" fill="none"/><path d="${d}" stroke="#7CC4F2" stroke-width="20" stroke-linecap="round" fill="none" class="wtr"/></svg>`; }
function rzPipesPlay(g){
  const S = g.C>3 ? 104 : 124, L = Math.round(512 - g.C*S/2), T = 160 + Math.round((g.R===3 ? 40 : 10));
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">Tap a pipe to turn it</div>
    <div class="rzpipes" id="rzpp" style="left:${L}px;top:${T}px;width:${g.C*S}px;height:${g.R*S}px">${g.cells.map((m,k)=>`<button class="rzpc" data-k="${k}" aria-label="Pipe" style="left:${(k%g.C)*S}px;top:${Math.floor(k/g.C)*S}px;width:${S}px;height:${S}px"><span style="transform:rotate(${g.rot[k]*90}deg)">${rzPipeSVG(m)}</span></button>`).join('')}</div>
    <div class="rzpsrc" style="left:${L-74}px;top:${T+g.s*S+S/2-36}px">💧</div><div class="rzpdst" id="rzpf" style="left:${L+g.C*S+8}px;top:${T+g.e*S+S/2-40}px">🌱</div>`);
  const rot = g.rot.slice(), turns = rot.map(r=>r*90); let done = false;
  document.querySelectorAll('.rzpc').forEach(b=>b.onclick=()=>{ if(!G.live || done) return; poke(); const k = +b.dataset.k; rot[k] = (rot[k]+1)%4; turns[k] += 90; b.firstElementChild.style.transform = `rotate(${turns[k]}deg)`; tone(380+Math.random()*80,.06,'square',.06);
    if(rzPipesSolved(g, rot)){ done = true; clearHint(); G.getT = null; document.getElementById('rzpp').classList.add('flow'); tone(523,.2,'triangle',.15); tone(784,.3,'triangle',.15,.2);
      setTimeout(()=>{ const f = document.getElementById('rzpf'); if(f){ f.textContent = '🌻'; f.classList.add('bloom'); } }, 500); rzDoneLater(1500); } });
  armHint(()=>{ const k = g.keys.find(k=>RZ_ROT(g.cells[k], rot[k])!==g.cells[k]); return k==null ? null : document.querySelector(`.rzpc[data-k="${k}"]`); });
}

/* ---------- Pack the suitcase ---------- */
const RZ_TRIPS = {snow:{n:'snowy mountains', ic:'🏔️❄️', yes:['🧣','🧤','🧥','🥾','⛷️']}, beach:{n:'sunny beach', ic:'🏖️☀️', yes:['🕶️','🩱','👒','🩴','🪣']}, rain:{n:'rainy city', ic:'🌧️🏙️', yes:['☂️','👢','🧥','🌂']}};
RZ_MAKE.suitcase = function(){ const e = easy(), k = rzOne(Object.keys(RZ_TRIPS)), T = RZ_TRIPS[k], need = e ? 2 : 3, nOpt = e ? 4 : 6;
  const yes = cshuf(T.yes).slice(0, need); const no = cshuf(Object.keys(RZ_TRIPS).filter(x=>x!==k).flatMap(x=>RZ_TRIPS[x].yes).filter(x=>!T.yes.includes(x))).slice(0, nOpt-need);
  return {type:'suitcase', title:`Pack for the ${T.n}!`, trip:k, yes, opts:cshuf([...yes, ...no]), sig:k+yes.join('')+no.join('')}; };
function rzSuitcasePlay(g){
  const T = RZ_TRIPS[g.trip];
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">0 / ${g.yes.length}</div>
    <div class="rzsuit"><div class="rztrip"><span>${T.ic}</span><b>Off to the ${T.n}!</b><small>What should we pack?</small></div>
    <div class="rzcase" id="rzcs"><div class="rzcasein" id="rzci"></div></div></div>
    <div class="rzsopts" id="rzso">${g.opts.map(x=>`<button class="rzsi2" data-x="${x}" aria-label="Thing to pack">${x}</button>`).join('')}</div>`);
  let n = 0; const ci = document.getElementById('rzci');
  document.querySelectorAll('.rzsi2').forEach(b=>b.onclick=()=>{ if(!G.live || b.classList.contains('in')) return;
    if(g.yes.includes(b.dataset.x)){ poke(); b.classList.add('in'); const s = document.createElement('span'); s.textContent = b.dataset.x; ci.appendChild(s); n++; tone(560+n*70,.12,'triangle',.15); document.getElementById('cnt').textContent = `${n} / ${g.yes.length}`;
      if(n>=g.yes.length){ clearHint(); G.getT = null; document.getElementById('rzcs').classList.add('shut'); rzDoneLater(1300); } else armHint(hint); }
    else { miss(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); tone(220,.12,'sine',.1); } });
  const hint = ()=>[...document.querySelectorAll('.rzsi2:not(.in)')].find(b=>g.yes.includes(b.dataset.x)); armHint(hint);
}

/* ---------- Ladybug hop ---------- */
RZ_MAKE.hop = function(){ const e = easy(); if(e){ const t = 2 + Math.floor(Math.random()*7); return {type:'hop', title:`Hop the ladybug to ${t}!`, mode:'to', start:0, t, sig:'to'+t}; }
  const start = 1 + Math.floor(Math.random()*5), add = 2 + Math.floor(Math.random()*(10-start-2)), back = Math.random()<.3 && start+add>3;
  if(back){ const s2 = start+add; return {type:'hop', title:`Start at ${s2}. Hop back ${add}. Where do you land?`, mode:'sum', start:s2, add:-add, t:s2-add, sig:'b'+s2+'-'+add}; }
  return {type:'hop', title:`Start at ${start}. Hop ${add} more. Where do you land?`, mode:'sum', start, add, t:start+add, sig:'s'+start+'+'+add}; };
function rzHopPlay(g){
  const X = n=>110 + n*80;
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">${g.mode==='to' ? `Hop to ${g.t}` : 'Where do you land?'}</div>
    <div class="rzline" id="rzln"><div class="rzrail"></div>${Array.from({length:11},(_,n)=>`<button class="rzln" data-n="${n}" style="left:${X(n)-100}px" aria-label="${n}"><i></i>${n}</button>`).join('')}
    <div class="rzbug" id="rzbg" style="left:${X(g.start)-100}px">🐞</div></div>
    ${g.mode==='to' ? `<div class="rzhopb"><button class="big green" id="rzhop">Hop! &#10145;</button><button class="big ghost" id="rzhbk">&#11013; Back</button></div>` : `<div class="rzhopb"><div class="rzmsay">${g.add>0 ? `${g.start} + ${g.add} = ?` : `${g.start} − ${-g.add} = ?`}</div></div>`}`);
  const bug = document.getElementById('rzbg'); let at = g.start, busy = false;
  const move = (n, cb)=>{ at = n; bug.classList.remove('jump'); void bug.offsetWidth; bug.classList.add('jump'); bug.style.left = (X(n)-100) + 'px'; tone(500+n*40,.1,'triangle',.15); if(n<=20 && n>0) lsoft(String(n), ['N:'+n]); if(cb) setTimeout(cb, 380); };
  if(g.mode==='to'){
    document.getElementById('rzhop').onclick = ()=>{ if(!G.live || busy || at>=10) return; poke(); move(at+1);
      if(at===g.t){ busy = true; clearHint(); G.getT = null; document.querySelector(`.rzln[data-n="${g.t}"]`).classList.add('ok'); rzDoneLater(1200); } };
    document.getElementById('rzhbk').onclick = ()=>{ if(!G.live || busy || at<=0) return; poke(); move(at-1); };
    document.querySelectorAll('.rzln').forEach(b=>b.onclick=()=>{ if(!G.live || busy) return; const n = +b.dataset.n; if(n===at+1) document.getElementById('rzhop').click(); else if(n===at-1) document.getElementById('rzhbk').click(); else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } });
    armHint(()=> at < g.t ? document.getElementById('rzhop') : document.getElementById('rzhbk'));
    setTimeout(()=>lsoft(String(g.t), ['N:'+g.t]), 1200);
  } else {
    document.querySelectorAll('.rzln').forEach(b=>b.onclick=()=>{ if(!G.live || busy) return; const n = +b.dataset.n;
      if(n===g.t){ poke(); busy = true; clearHint(); G.getT = null; const step = g.add>0 ? 1 : -1; let k = 0;
        (function hopOn(){ if(k >= Math.abs(g.add)){ b.classList.add('ok'); rzDoneLater(900); return; } k++; move(g.start + step*k, hopOn); })(); }
      else { miss(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); tone(220,.12,'sine',.1); } });
    armHint(()=>document.querySelector(`.rzln[data-n="${g.t}"]`));
  }
}

/* ===== rzfun5.js (v23.18): hard mazes + more Challenge games + more motion (Chester: "Are mazes in the game? Make the mazes hard")
   - bigmaze:  "Giant maze" big perfect mazes (no shortcuts): Easy 9x6, Challenge 14x8 with 4 gems. (cat maze)
   - darkmaze: "Lantern maze" only the area around the ladybug is lit: Easy 7x5, Challenge 11x7 with 3 gems. (cat maze)
   - The normal Challenge maze is bigger too (11x6 instead of 9x5), with fewer shortcuts.
   - bins:     "Sort it out" put each picture in the right basket (colour, or land / sea / sky). (cat detect)
   - stickmem: "Sticker memory" flip Grok's scrapbook stickers to find pairs. (cat slide)
   - bop:      "Bug bop" tap the ladybugs when they pop up (Challenge: not the bees!). (cat play)
   - balance:  "Balance the scale" add apples until both sides weigh the same. (cat num)
   Motion: Razzle hops when a child gets something right and tilts his head on a wrong tap; pavilion doors breathe. ===== */
function rzMazeGen(W, H, loops){ const N = W*H, wall = Array.from({length:N}, ()=>[1,1,1,1]), D = [[0,-1],[1,0],[0,1],[-1,0]];
  const seen = new Array(N).fill(false), st = [Math.floor(Math.random()*N)]; seen[st[0]] = true;
  while(st.length){ const c = st[st.length-1], x = c%W, y = (c/W)|0;
    const nb = cshuf([0,1,2,3]).filter(d=>{ const nx = x+D[d][0], ny = y+D[d][1]; return nx>=0 && ny>=0 && nx<W && ny<H && !seen[ny*W+nx]; });
    if(!nb.length){ st.pop(); continue; } const d = nb[0], n = (y+D[d][1])*W + x+D[d][0]; wall[c][d] = 0; wall[n][(d+2)%4] = 0; seen[n] = true; st.push(n); }
  for(let k=0;k<loops;k++){ const c = Math.floor(Math.random()*N), x = c%W, y = (c/W)|0, d = rzOne([1,2]); const nx = x+D[d][0], ny = y+D[d][1]; if(nx<W && ny<H){ wall[c][d] = 0; wall[ny*W+nx][(d+2)%4] = 0; } }
  return wall; }
function rzMazeBuild(type, W, H, loops, nGems, title){ const wall = rzMazeGen(W, H, loops);
  const corners = [0, W-1, (H-1)*W, H*W-1], start = rzOne(corners), dist = rzBfs(wall, W, H, start), goal = dist.indexOf(Math.max(...dist));
  const gems = nGems ? cshuf([...Array(W*H).keys()].filter(c=>c!==start && c!==goal && dist[c]>=4)).slice(0, nGems) : [];
  return {type, title, W, H, wall, start, goal, gems, sig:W+'x'+H+':'+start+':'+wall.map(w=>w[1]+''+w[2]).join('')+':'+goal+':'+gems.slice().sort((a,b)=>a-b).join(',')}; }
/* the normal Challenge maze: bigger, fewer shortcuts */
{ const base = RZ_MAKE.maze; RZ_MAKE.maze = function(){ if(easy()) return base(); return rzMazeBuild('maze', 11, 6, 1, 3, 'Maze: grab the gems, then reach the treasure!'); }; }
RZ_MAKE.bigmaze = function(){ const e = easy(); return e ? rzMazeBuild('bigmaze', 9, 6, 0, 0, 'Giant maze: find the way to the treasure!') : rzMazeBuild('bigmaze', 14, 8, 0, 4, 'Giant maze: grab 4 gems, then find the treasure!'); };
RZ_MAKE.darkmaze = function(){ const e = easy(); const g = e ? rzMazeBuild('darkmaze', 7, 5, 1, 0, 'Lantern maze: it is dark! Find the treasure!') : rzMazeBuild('darkmaze', 11, 7, 0, 3, 'Lantern maze: find 3 gems in the dark, then the treasure!'); g.fog = e ? 2.6 : 1.9; return g; };

    fog.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(20,16,40,0) 0px, rgba(20,16,40,0) ${(r*0.55).toFixed(0)}px, rgba(20,16,40,.93) ${r.toFixed(0)}px)`;

   - build:   "Build it like the picture" make the snowman / robot / ice cream match the little picture. (cat slide)
   Nothing is lost on a wrong tap. ===== */
/* ---------- Three in a row ---------- */
RZ_MAKE.ttt = function(){ const e = easy(); return {type:'ttt', title: e ? 'Three in a row! You are the ladybug.' : 'Beat Razzle at three in a row!', smart:!e, need:1, sig:'ttt'+(e?'e':'c')+Math.floor(Math.random()*50)}; };
const RZ_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function rzTttWin(b, p){ return RZ_LINES.find(l=>l.every(i=>b[i]===p)); }
function rzTttPlay(g){
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">You: 🐞 &nbsp; Razzle: 🪲</div>
    <div class="rzttt" id="rztt">${Array.from({length:9},(_,i)=>`<button class="rztc" data-i="${i}" aria-label="Square ${i+1}"></button>`).join('')}</div><div class="rzmsay rzttm" id="rztm">Your turn! Tap a square.</div>`);
  let b = Array(9).fill(''), busy = false; const cells = [...document.querySelectorAll('.rztc')], msg = t=>{ document.getElementById('rztm').textContent = t; };
  const paint = ()=>cells.forEach((c,i)=>{ c.textContent = b[i]==='x' ? '🐞' : b[i]==='o' ? '🪲' : ''; });
  function razzle(){ const free = b.map((v,i)=>v?null:i).filter(i=>i!==null); if(!free.length) return;
    let pick = null;
    if(g.smart){ const tryWin = p=>free.find(i=>{ const t = b.slice(); t[i] = p; return rzTttWin(t, p); });
      pick = tryWin('o'); if(pick==null) pick = Math.random() < .8 ? tryWin('x') : null; if(pick==null && !b[4] && Math.random()<.6) pick = 4; }
    if(pick==null) pick = rzOne(free); b[pick] = 'o'; paint(); cells[pick].classList.add('pop'); tone(330,.1,'triangle',.12); }
  function reset(t){ msg(t); setTimeout(()=>{ if(!G.live) return; b = Array(9).fill(''); paint(); cells.forEach(c=>c.classList.remove('pop','win')); busy = false; msg('New round! Your turn.'); }, 1500); }
  cells.forEach((c,i)=>c.onclick=()=>{ if(!G.live || busy || b[i]) return; poke(); b[i] = 'x'; paint(); c.classList.add('pop'); tone(620,.1,'triangle',.14);
    const w = rzTttWin(b, 'x'); if(w){ busy = true; w.forEach(k=>cells[k].classList.add('win')); msg('Three in a row! You win!'); clearHint(); G.getT = null; rzDoneLater(1200); return; }
    if(b.every(v=>v)){ busy = true; reset("It's a tie! Let's play again."); return; }
    busy = true; msg('Razzle is thinking...'); setTimeout(()=>{ if(!G.live) return; razzle(); const r = rzTttWin(b, 'o');
      if(r){ r.forEach(k=>cells[k].classList.add('win')); miss(); reset('Razzle got three! Try again!'); return; }
      if(b.every(v=>v)){ reset("It's a tie! Let's play again."); return; } busy = false; msg('Your turn!'); }, 700); });
  armHint(()=>{ if(busy) return null; const free = b.map((v,i)=>v?null:i).filter(i=>i!==null); const win = free.find(i=>{ const t = b.slice(); t[i] = 'x'; return rzTttWin(t,'x'); }); return cells[win!=null ? win : free[0]]; });
}

/* ---------- Ladybug race ---------- */
RZ_MAKE.race = function(){ const e = easy(); return {type:'race', title: e ? 'Roll the dice and hop to the flower!' : 'Roll two dice and hop to the flower!', len:e ? 12 : 20, dice:e ? 1 : 2, sig:'race'+(e?'e':'c')+Math.floor(Math.random()*40)}; };

function rzRacePlay(g){
  const per = Math.ceil((g.len+1)/2), rows = 2, sz = g.len<=12 ? 104 : 74;
  const sq = Array.from({length:g.len+1},(_,k)=>{ const r = Math.floor(k/per), c0 = k%per; const c = r%2 ? per-1-c0 : c0; return [c, r]; });
  cgameShell('rz', 0, CITIES.rz.stops[0].scene(), `<div class="counter" id="cnt">Roll the dice!</div>
    <div class="rzrace" id="rzrc" style="width:${per*sz}px;height:${rows*sz}px">${sq.map(([c,r],k)=>`<button class="rzsq ${k===g.len?'end':''}" data-k="${k}" style="left:${c*sz}px;top:${r*sz}px;width:${sz-6}px;height:${sz-6}px" aria-label="Square ${k}">${k===g.len?'🌸':k||'🏁'}</button>`).join('')}
    <div class="rzrb" id="rzrb" style="width:${sz-6}px;height:${sz-6}px;font-size:${sz*.55}px">🐞</div></div>

  let pos = 0, left = 0, target = 0; const bug = document.getElementById('rzrb'), roll = document.getElementById('rzroll');
  const place = k=>{ const [c,r] = sq[k]; bug.style.left = (c*sz)+'px'; bug.style.top = (r*sz)+'px'; };
  place(0);
  roll.onclick = ()=>{ if(!G.live || left>0) return; poke(); const d = Array.from({length:g.dice},()=>1+Math.floor(Math.random()*6)); let n = d.reduce((a,b)=>a+b,0);
    document.getElementById('rzdv').innerHTML = d.map(rzDie).join(''); document.querySelectorAll('.rzdie').forEach(x=>{ x.classList.add('rolling'); });
    tone(300,.05,'square',.06); tone(360,.05,'square',.06,.08); tone(420,.05,'square',.06,.16);
    left = Math.min(n, g.len-pos); target = pos + left; roll.disabled = true; document.getElementById('cnt').textContent = `Hop ${n}! Tap the squares: ${pos+1}...`;
    if(n<=20) setTimeout(()=>lsoft(String(n), ['N:'+n]), 500); armHint(()=>document.querySelector(`.rzsq[data-k="${pos+1}"]`)); };
  document.querySelectorAll('.rzsq').forEach(s=>s.onclick=()=>{ if(!G.live || !left) return; const k = +s.dataset.k;
    if(k===pos+1){ poke(); pos = k; left--; place(pos); bug.classList.remove('jump'); void bug.offsetWidth; bug.classList.add('jump'); s.classList.add('step'); tone(500+pos*15,.08,'triangle',.13); if(pos<=20) lsoft(String(pos), ['N:'+pos]);
      if(pos>=g.len){ clearHint(); G.getT = null; document.getElementById('cnt').textContent = 'You made it to the flower!'; rzDoneLater(1000); return; }

    else { miss(); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); } });
